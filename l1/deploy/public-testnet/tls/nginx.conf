server {
  listen 443 ssl;
  http2 on;
  server_name __OPERATOR_RPC_HOSTNAME__;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_certificate /etc/zyron/tls/fullchain.pem;
  ssl_certificate_key /etc/zyron/tls/privkey.pem;
  client_max_body_size 256k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  location ~ ^/(proposal/attest|round/skip|round/lock|round/report|round/complete|block)$ {
    return 403;
  }
  location /metrics {
    return 403;
  }
  location / {
    proxy_pass http://__PUBLIC_RPC_UPSTREAM__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
