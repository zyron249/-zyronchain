# Render Blueprint for the ZyronChain WALLET TESTNET RPC (no value).
#
# This file is intentionally NOT at the repo root: the existing Render services
# (website, Telegram game) are managed in the dashboard, and a root render.yaml
# could be mistaken for their config. Connect it in the Render dashboard with
# New > Blueprint, Blueprint path "deploy/render/wallet-testnet-rpc.yaml".
# It defines one new free web service and touches nothing else.
services:
  - type: web
    name: zyron-wallet-testnet-rpc
    runtime: node
    plan: free
    region: ohio
    branch: main
    rootDir: l1
    buildCommand: npm ci && npm run build
    startCommand: node scripts/public-testnet-rpc.mjs
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - src/**
        - scripts/public-testnet-rpc.mjs
        - scripts/wallet-testnet-durable.mjs
        - package.json
        - package-lock.json
        - tsconfig.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render serves web services through Cloudflare, which sets
      # CF-Connecting-IP; with ZYRON_TRUST_PROXY=1 the gateway uses that header
      # (never the client-supplied leftmost X-Forwarded-For entry) as the
      # rate-limit identity.
      - key: ZYRON_TRUST_PROXY
        value: "1"
      - key: ZYRON_TESTNET_CHAIN_ID
        value: zyron-wallet-testnet-1
      # Testnet-only secret so the validator and faucet keys survive restarts.
      # Never reuse any mainnet or allocation key material here. Keep this value
      # stable: durable replay submits transfers signed by the seed-derived faucet.
      - key: ZYRON_TESTNET_SEED
        generateValue: true
      # Optional Neon Postgres URL for this testnet only. sync: false so the
      # secret is entered in the dashboard and is never committed. Use a
      # database and role that are not the game's. Leave it unset to keep
      # ephemeral state. Do not add a keep-alive pinger; free instance hours
      # are shared with another always-on service.
      # postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      - key: ZYRON_TESTNET_DATABASE_URL
        sync: false
