# ZyronChain open TESTNET (tokens have no value) on a Render free web service.
# Use as a Blueprint with path deploy/open-testnet/render.yaml. Free instances
# have no persistent disk, so state persists through sealed snapshots: the
# gateway serves GET /state/snapshot (AES-256-GCM, key generated by Render and
# never stored elsewhere), an external keeper (deploy/open-testnet/snapshot-keeper.sh)
# publishes it as a GitHub release asset, and a cold start restores from that
# asset. The keeper's polling also keeps the free instance from idling.
# Not a mainnet profile; never put mainnet keys here.
services:
  - type: web
    name: zyron-open-testnet
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: cd l1 && npm ci && npm run build
    startCommand: cd l1 && node scripts/open-testnet.mjs run --dir /tmp/zyron-open-testnet --host 0.0.0.0 --init-if-missing --restore-url https://github.com/zyron249/-zyronchain/releases/download/open-testnet-state/state.enc
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ZYRON_TESTNET_CHAIN_ID
        value: zyron-open-testnet-render-1
      - key: ZYRON_TESTNET_STATE_SECRET
        generateValue: true
      # Render serves web services through Cloudflare, which sets
      # CF-Connecting-IP to the real client; the gateway uses it as the
      # rate-limit identity. Without it every client would share the Render
      # proxy's bucket. Never set this where clients can reach the gateway
      # without passing through Cloudflare.
      - key: ZYRON_TRUST_CF_CONNECTING_IP
        value: "1"
