name: Standalone L1 Hosted Soak Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-hosted-duration-soak-evidence.yml'
      - '.github/workflows/l1-hosted-soak-action-custody-policy.yml'
      - '.github/scripts/verify-l1-hosted-soak-action-custody.mjs'
      - 'docs/L1_HOSTED_SOAK_ACTION_CUSTODY.md'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify hosted-soak action custody policy
        run: node .github/scripts/verify-l1-hosted-soak-action-custody.mjs
