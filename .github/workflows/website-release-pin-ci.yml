name: Website Canonical Release Pin CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-release-pin-ci.yml'
      - 'l1/**'
      - 'WHITEPAPER.md'
      - 'docs/L1_THREAT_MODEL.md'
      - 'docs/STANDALONE_L1_READINESS.md'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-release-pin-ci.yml'
      - 'l1/**'
      - 'WHITEPAPER.md'
      - 'docs/L1_THREAT_MODEL.md'
      - 'docs/STANDALONE_L1_READINESS.md'

permissions:
  contents: read

jobs:
  canonical-release-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical L1 pin and offline browser boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_REF="$(sed -nE "s/^[[:space:]]*const RELEASE_REF = '([0-9a-f]{40})';$/\1/p" website/release.js)"
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "website/release.js does not contain exactly one valid canonical release SHA" >&2
            exit 1
          fi

          git cat-file -e "${RELEASE_REF}^{commit}"

          # The pin is enforced when the website itself changes. A change that
          # touches only canonical L1/security paths cannot also move the pin to
          # its own base without rewriting the website in every L1 PR, so it is
          # reported as release-pin drift (warning + job summary) instead.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGE_BASE="$PR_BASE_SHA"
          else
            CHANGE_BASE="$PUSH_BEFORE_SHA"
          fi
          WEBSITE_CHANGED=1
          if [[ "$CHANGE_BASE" =~ ^[0-9a-f]{40}$ && ! "$CHANGE_BASE" =~ ^0{40}$ ]]; then
            git cat-file -e "${CHANGE_BASE}^{commit}"
            if ! WEBSITE_DIFF="$(git diff --name-only "$CHANGE_BASE"..HEAD -- 'website/**')"; then
              echo "Unable to determine website changes against $CHANGE_BASE" >&2
              exit 1
            fi
            [[ -n "$WEBSITE_DIFF" ]] || WEBSITE_CHANGED=0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$WEBSITE_CHANGED" == "1" ]]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Missing pull-request base SHA" >&2
              exit 1
            fi
            if [[ "$RELEASE_REF" != "$PR_BASE_SHA" ]]; then
              echo "Website release pin is stale: $RELEASE_REF != reviewed base $PR_BASE_SHA" >&2
              exit 1
            fi
          fi

          if ! CHANGED_L1="$(git diff --name-only "$RELEASE_REF"..HEAD -- 'l1/**' 'WHITEPAPER.md' 'docs/L1_THREAT_MODEL.md' 'docs/STANDALONE_L1_READINESS.md')"; then
            echo "Unable to compare the website pin $RELEASE_REF with HEAD" >&2
            exit 1
          fi
          if [[ -n "$CHANGED_L1" ]]; then
            # A website change must pin the reviewed base, which already
            # contains every previously merged L1 commit. L1 files introduced
            # in this same change cannot be inside that pin until after it
            # merges, so they are the drift warning below rather than a
            # failure. A pin that is behind the reviewed base still fails.
            COVERED_TOGETHER=0
            if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_REF" == "$PR_BASE_SHA" ]]; then
              COVERED_TOGETHER=1
            fi
            if [[ "$EVENT_NAME" != "pull_request" && "$RELEASE_REF" == "$PUSH_BEFORE_SHA" ]]; then
              COVERED_TOGETHER=1
            fi
            if [[ "$WEBSITE_CHANGED" == "1" && "$COVERED_TOGETHER" != "1" ]]; then
              echo "Website pin does not cover canonical L1/security changes:" >&2
              printf '%s\n' "$CHANGED_L1" >&2
              exit 1
            fi
            DRIFT_COUNT="$(printf '%s\n' "$CHANGED_L1" | wc -l | tr -d ' ')"
            echo "::warning title=Website release pin drift::website/release.js pins $RELEASE_REF; $DRIFT_COUNT canonical L1/security file(s) changed since. The next website change must move the pin."
            {
              echo "### Website release pin drift"
              echo "website/release.js pins \`$RELEASE_REF\`. Canonical L1/security files changed since then:"
              echo '```'
              printf '%s\n' "$CHANGED_L1"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const pages = ['website/index.html', 'website/wallet.html', 'website/validator.html', 'website/mining.html'];
          const openProbePages = new Set(['website/index.html', 'website/wallet.html']);
          // The CSP is compared directive by directive with exact source lists:
          // a substring check would accept a look-alike host, extra sources or
          // a duplicate directive placed first (browsers honour the first one).
          const baseCsp = {
            'default-src': "'self'",
            'script-src': "'self'",
            'style-src': "'self'",
            'img-src': "'self' data:",
            'object-src': "'none'",
            'base-uri': "'none'",
            'form-action': "'self'",
            'frame-src': "'none'"
          };
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const metas = [...html.matchAll(/<meta\b[^>]*Content-Security-Policy[^>]*>/gi)];
            if (metas.length !== 1) throw new Error(`${page} must carry exactly one CSP meta tag (found ${metas.length})`);
            // HTML and CSP separate tags, attributes and tokens only with ASCII
            // whitespace (TAB, LF, FF, CR, SPACE). JavaScript \s also matches
            // U+00A0, U+000B, U+2003, U+FEFF and others, which a browser parses
            // as text, so every structural check below uses [\t\n\f\r ].
            const content = metas[0][0].match(/^<meta[\t\n\f\r ]+http-equiv="Content-Security-Policy"[\t\n\f\r ]+content="([^"]*)"[\t\n\f\r ]*\/?>$/);
            if (!content) throw new Error(`${page} CSP meta tag is not in the reviewed form: ${metas[0][0]}`);
            // The tag must be an active element of <head> that applies before
            // anything loads: only the doctype, <html>, <head>, other <meta>
            // tags and a plain <title> may precede it. Browsers ignore a CSP
            // tag inside a comment or raw-text element or outside <head>, and
            // a policy placed after a script or stylesheet does not cover it.
            const headPrefix = /^<!doctype html>[\t\n\f\r ]*<html lang="en">[\t\n\f\r ]*<head>[\t\n\f\r ]*(?:(?:<meta(?:[\t\n\f\r ]+[a-z:-]+="[^"<>]*")+[\t\n\f\r ]*\/?>|<title>[^<>]*<\/title>)[\t\n\f\r ]*)*$/i;
            if (!headPrefix.test(html.slice(0, metas[0].index))) {
              throw new Error(`${page} CSP meta tag must be in <head> before any comment, script, stylesheet or raw-text element`);
            }
            const csp = new Map();
            for (const part of content[1].split(';')) {
              const tokens = part.split(/[\t\n\f\r ]+/).filter(Boolean);
              if (tokens.length === 0) continue;
              const name = tokens[0].toLowerCase();
              if (csp.has(name)) throw new Error(`${page} CSP repeats directive ${name}`);
              csp.set(name, tokens.slice(1).join(' '));
            }
            const expected = {
              ...baseCsp,
              'connect-src': openProbePages.has(page) ? 'https://zyron-open-testnet.onrender.com' : "'none'"
            };
            const names = [...csp.keys()].sort().join(',');
            if (names !== Object.keys(expected).sort().join(',')) throw new Error(`${page} CSP directives are not the reviewed set: ${names}`);
            for (const [name, value] of Object.entries(expected)) {
              if (csp.get(name) !== value) throw new Error(`${page} CSP ${name} must be exactly ${value} (found ${csp.get(name)})`);
            }
            if (!html.includes('name="referrer" content="no-referrer"')) throw new Error(`${page} missing browser security marker: no-referrer`);
            for (const match of html.matchAll(/<a\b[^>]*target=["']_blank["'][^>]*>/gi)) {
              const tag = match[0];
              if (!/\brel=["'][^"']*\bnoopener\b[^"']*["']/i.test(tag) ||
                  !/\brel=["'][^"']*\bnoreferrer\b[^"']*["']/i.test(tag)) {
                throw new Error(`${page} has target=_blank without noopener+noreferrer: ${tag}`);
              }
            }
          }

          const index = fs.readFileSync('website/index.html', 'utf8');
          if (!index.includes('cd ./-zyronchain/l1')) {
            throw new Error('Homepage quick-start must safely enter the leading-dash repository directory');
          }
          // Mining retired by owner decision (2026-09-30): the homepage must carry
          // the retirement disclosure and must not advertise mining parameters
          // or link the retired mining launchpad.
          for (const marker of [
            'Mining retired',
            'Mining has been shut down by owner decision',
            'not yet merged to the main branch'
          ]) {
            if (!index.includes(marker)) throw new Error(`Homepage mining retirement disclosure missing: ${marker}`);
          }
          for (const retired of [
            'Protocol-v5 mining still exists',
            '6.25 ZYN',
            '20-bit SHA-256 target',
            'href="./mining.html"'
          ]) {
            if (index.includes(retired)) throw new Error(`Homepage still advertises retired mining: ${retired}`);
          }
          NODE

          echo "canonical-release-pin-and-browser-policy-ok ${RELEASE_REF}"
