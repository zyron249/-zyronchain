name: Miner Release Promotion Gate CI

on:
  pull_request:
    paths:
      - 'docs/miner-release-promotion.json'
      - 'docs/MINER_RELEASE_PROMOTION.md'
      - 'docs/MINER_RELEASE_PROMOTION_CUSTODY.md'
      - 'l1/scripts/verify-miner-release-promotion.mjs'
      - 'l1/scripts/test-miner-release-promotion.mjs'
      - 'l1/scripts/verify-miner-release-provenance-subjects.mjs'
      - 'l1/scripts/test-miner-release-provenance-subjects.mjs'
      - 'l1/scripts/verify-miner-release-signing-subjects.mjs'
      - 'l1/scripts/test-miner-release-signing-subjects.mjs'
      - 'l1/scripts/verify-miner-release-checksum-subjects.mjs'
      - 'l1/scripts/test-miner-release-checksum-subjects.mjs'
      - 'l1/scripts/verify-miner-release-sbom-evidence.mjs'
      - 'l1/scripts/test-miner-release-sbom-evidence.mjs'
      - 'l1/scripts/verify-miner-release-immutable-subjects.mjs'
      - 'l1/scripts/test-miner-release-immutable-subjects.mjs'
      - 'l1/scripts/verify-miner-public-mining-activation-subjects.mjs'
      - 'l1/scripts/test-miner-public-mining-activation-subjects.mjs'
      - 'scripts/verify-miner-release-promotion-action-custody.mjs'
      - '.github/workflows/miner-release-promotion-gate.yml'
      - '.github/workflows/miner-release-promotion-action-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up canonical Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify canonical policy remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-promotion.mjs
      - name: Verify promotion provenance subject binding remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-provenance-subjects.mjs
      - name: Verify platform signing subject binding remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-signing-subjects.mjs
      - name: Verify checksum subject binding remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-checksum-subjects.mjs
      - name: Verify per-platform SBOM evidence remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-sbom-evidence.mjs
      - name: Verify immutable release subject binding remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-release-immutable-subjects.mjs
      - name: Verify public mining activation subject binding remains fail-closed
        working-directory: l1
        run: node scripts/verify-miner-public-mining-activation-subjects.mjs
      - name: Run positive and negative promotion vectors
        working-directory: l1
        run: node scripts/test-miner-release-promotion.mjs
      - name: Run provenance subject binding regressions
        working-directory: l1
        run: node scripts/test-miner-release-provenance-subjects.mjs
      - name: Run signing subject binding regressions
        working-directory: l1
        run: node scripts/test-miner-release-signing-subjects.mjs
      - name: Run checksum subject binding regressions
        working-directory: l1
        run: node scripts/test-miner-release-checksum-subjects.mjs
      - name: Run per-platform SBOM evidence regressions
        working-directory: l1
        run: node scripts/test-miner-release-sbom-evidence.mjs
      - name: Run immutable release subject regressions
        working-directory: l1
        run: node scripts/test-miner-release-immutable-subjects.mjs
      - name: Run public mining activation subject regressions
        working-directory: l1
        run: node scripts/test-miner-public-mining-activation-subjects.mjs
