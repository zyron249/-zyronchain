name: Standalone L1 Render Gateway Socket Red-Team CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  render-gateway-socket-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Exercise slow headers and oversized header rejection
        run: |
          set -o pipefail
          node l1/scripts/render-gateway-socket-redteam.mjs | tee "${RUNNER_TEMP}/render-gateway-socket-redteam.log"
      - name: Upload socket red-team evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-render-gateway-socket-redteam-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-gateway-socket-redteam.log
          if-no-files-found: error
          retention-days: 90
