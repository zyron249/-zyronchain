name: Windows Miner Package Contract CI

on:
  pull_request:
    paths:
      - 'l1/scripts/package-windows-miner-zip.mjs'
      - 'l1/scripts/test-windows-miner-package-contract.mjs'
      - 'l1/scripts/verify-windows-miner-zip.ps1'
      - 'l1/scripts/README-windows-miner-package.txt'
      - 'l1/scripts/copy-windows-miner-readme.mjs'
      - 'l1/scripts/verify-windows-miner-package-files.mjs'
      - 'l1/scripts/test-windows-miner-readiness.mjs'
      - 'l1/scripts/test-windows-package-static.mjs'
      - 'l1/scripts/run-windows-package-contracts.mjs'
      - 'docs/WINDOWS_MINER_DISTRIBUTION.md'
      - 'docs/WINDOWS_MINER_READINESS.md'
      - '.github/workflows/miner-release-candidate.yml'
      - '.github/workflows/windows-miner-package-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
      - name: Verify package contracts
        working-directory: l1
        run: node scripts/run-windows-package-contracts.mjs
