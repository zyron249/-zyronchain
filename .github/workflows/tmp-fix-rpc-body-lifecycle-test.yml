name: Temporary RPC body lifecycle test fixer

on:
  push:
    branches:
      - agent/rpc-json-parse-budget-v2
    paths:
      - '.github/workflows/tmp-fix-rpc-body-lifecycle-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpc-json-parse-budget-v2
          persist-credentials: true
      - name: Patch lifecycle regression and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('l1/test/l1.test.ts')
          text = path.read_text()
          start_marker = 'test("RPC body reservation remains held after parsing until handler completion", async () => {'
          start = text.index(start_marker)
          end = text.index('\n});', start) + len('\n});')
          replacement = r'''test("RPC body reservation remains held after parsing until handler completion", async () => {
            const directory = await mkdtemp(join(tmpdir(), "zyron-rpc-body-handler-budget-"));
            const store = await ChainStore.open(genesis(), directory);
            const service = new NodeService(store);
            let signalHandlerEntered!: () => void;
            let releaseHandler!: () => void;
            const handlerEntered = new Promise<void>((resolve) => { signalHandlerEntered = resolve; });
            const handlerGate = new Promise<void>((resolve) => { releaseHandler = resolve; });
            service.acceptFinalizedBlock = async () => {
              signalHandlerEntered();
              await handlerGate;
            };
            const heldBody = JSON.stringify({ padding: "x".repeat(800) });
            const heldBodyBytes = Buffer.byteLength(heldBody);
            const maxInflightRequestBodyBytes = heldBodyBytes * 4;
            const server = createRpcServer(service, {
              maxInflightRequests: 2,
              maxInflightRequestBodyBytes
            });

            try {
              await new Promise<void>((resolveListen, reject) => {
                server.once("error", reject);
                server.listen(0, "127.0.0.1", resolveListen);
              });
              const address = server.address();
              if (!address || typeof address === "string") throw new Error("RPC handler-budget server has no TCP address");
              const base = `http://127.0.0.1:${address.port}`;
              const heldResponsePromise = fetch(`${base}/block`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: heldBody
              });
              await handlerEntered;

              const heldMetrics = await fetch(`${base}/metrics`);
              const heldMetricsPayload = await heldMetrics.json() as {
                rpc: { requestBodyBytesInUse: number; maxRequestBodyBytes: number; rejectedRequestBodies: number };
              };
              assert.equal(heldMetricsPayload.rpc.requestBodyBytesInUse, heldBodyBytes);
              assert.equal(heldMetricsPayload.rpc.maxRequestBodyBytes, maxInflightRequestBodyBytes);
              assert.equal(heldMetricsPayload.rpc.rejectedRequestBodies, 0);

              releaseHandler();
              const heldResponse = await heldResponsePromise;
              assert.equal(heldResponse.status, 202);
              await heldResponse.arrayBuffer();

              const releasedMetrics = await fetch(`${base}/metrics`);
              const releasedMetricsPayload = await releasedMetrics.json() as {
                rpc: { requestBodyBytesInUse: number };
              };
              assert.equal(releasedMetricsPayload.rpc.requestBodyBytesInUse, 0);

              const tx = createTransfer(
                {
                  chainId: genesis().chainId,
                  nonce: 1,
                  sender: alice,
                  receiver: bob,
                  amountAtoms: 1,
                  feeAtoms: 1,
                  timestampMs: genesis().timestampMs + 1
                },
                alicePrivate,
                alicePublic
              );
              const recovered = await fetch(`${base}/tx`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(tx)
              });
              assert.equal(recovered.status, 202);
              assert.equal(service.mempool.size, 1);
            } finally {
              releaseHandler();
              await new Promise<void>((resolveClose, reject) =>
                server.close((error) => error ? reject(error) : resolveClose())
              );
              await rm(directory, { recursive: true, force: true });
            }
          });'''
          path.write_text(text[:start] + replacement + text[end:])
          workflow = Path('.github/workflows/tmp-fix-rpc-body-lifecycle-test.yml')
          workflow.unlink()
      - name: Commit patch
        run: |
          git config user.name "ZyronChain CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix RPC body lifecycle regression for parse accounting"
          git push origin HEAD:agent/rpc-json-parse-budget-v2
