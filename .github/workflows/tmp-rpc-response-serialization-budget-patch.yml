name: Temporary RPC response serialization patcher

on:
  push:
    branches:
      - agent/rpc-response-serialization-budget-v1
    paths:
      - scripts/tmp-rpc-response-serialization-budget-patch.mjs
      - .github/workflows/tmp-rpc-response-serialization-budget-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply bounded response serialization hardening
        run: node scripts/tmp-rpc-response-serialization-budget-patch.mjs

      - name: Commit final branch state and remove temporary patcher
        run: |
          git config user.name "ZyronChain Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/tmp-rpc-response-serialization-budget-patch.mjs
          git rm .github/workflows/tmp-rpc-response-serialization-budget-patch.yml
          git add l1/src/node-base.ts l1/test/rpc-response-serialization-budget.test.ts docs/RPC_RESPONSE_SERIALIZATION_BUDGET.md docs/L1_THREAT_MODEL.md
          git commit -m "Harden RPC response serialization memory admission"
          git push origin HEAD:agent/rpc-response-serialization-budget-v1
