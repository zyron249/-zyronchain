name: Live Testnet Security Probe

on:
  pull_request:
    paths:
      - "l1/scripts/live-testnet-security-probe.mjs"
      - ".github/workflows/live-testnet-security-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Run controlled external security probe
        env:
          ZYRON_LIVE_TESTNET_URL: https://zyronchain-private-testnet.onrender.com
          ZYRON_LIVE_PROBE_OUTPUT: ${{ runner.temp }}/live-testnet-security-probe.json
        run: node l1/scripts/live-testnet-security-probe.mjs
      - name: Upload security probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-testnet-security-probe-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-testnet-security-probe.json
          if-no-files-found: error
          retention-days: 30
