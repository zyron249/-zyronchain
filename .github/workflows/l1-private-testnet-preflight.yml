name: Standalone L1 Private Testnet Preflight CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  private-testnet-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify internal private-testnet preflight twice
        run: |
          evidence="${RUNNER_TEMP}/zyron-private-testnet-preflight"
          mkdir -p "$evidence"
          node l1/scripts/verify-private-testnet-preflight.mjs \
            --config docs/l1-private-testnet-preflight.json \
            --out "$evidence/preflight-a.json" \
            --commit-sha "$GITHUB_SHA"
          node l1/scripts/verify-private-testnet-preflight.mjs \
            --config docs/l1-private-testnet-preflight.json \
            --out "$evidence/preflight-b.json" \
            --commit-sha "$GITHUB_SHA"
          cmp "$evidence/preflight-a.json" "$evidence/preflight-b.json"
          mv "$evidence/preflight-a.json" "$evidence/private-testnet-preflight.json"
          rm "$evidence/preflight-b.json"
          cp docs/l1-private-testnet-preflight.json "$evidence/l1-private-testnet-preflight.json"
          cd "$evidence"
          sha256sum private-testnet-preflight.json l1-private-testnet-preflight.json > SHA256SUMS
          cat private-testnet-preflight.json
          cat SHA256SUMS
      - name: Verify connected Render Free profile remains smoke-only
        run: |
          evidence="${RUNNER_TEMP}/zyron-private-testnet-preflight"
          node l1/scripts/verify-render-hosting-profile.mjs \
            --policy docs/l1-render-hosting-profile.json \
            --docs docs/RENDER_PRIVATE_TESTNET.md \
            --out "$evidence/render-hosting-profile.json" \
            --commit-sha "$GITHUB_SHA"
          cd "$evidence"
          sha256sum render-hosting-profile.json >> SHA256SUMS
          cat render-hosting-profile.json
      - name: Upload private-testnet preflight evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-private-testnet-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-private-testnet-preflight/private-testnet-preflight.json
            ${{ runner.temp }}/zyron-private-testnet-preflight/l1-private-testnet-preflight.json
            ${{ runner.temp }}/zyron-private-testnet-preflight/render-hosting-profile.json
            ${{ runner.temp }}/zyron-private-testnet-preflight/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
