name: Temporary peer response lease patch PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/peer-response-json-parse-budget-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42b910ddb2c911901773861b2f7f1238d7f0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply ownership-lifetime hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('l1/src/node-base.ts')
          s = p.read_text()

          replacements = [
          ('''      const blocks = await getJson(`${base}/blocks?from=${from}&limit=${MAX_SYNC_BLOCKS}`, MAX_SYNC_RESPONSE_BYTES, parsePeerBlockBatch);\n      for (const block of blocks) {\n        await service.acceptFinalizedBlock(block);\n        accepted += 1;\n      }\n''', '''      const retained = await getJsonRetained(`${base}/blocks?from=${from}&limit=${MAX_SYNC_BLOCKS}`, MAX_SYNC_RESPONSE_BYTES, parsePeerBlockBatch);\n      try {\n        for (const block of retained.value) {\n          await service.acceptFinalizedBlock(block);\n          accepted += 1;\n        }\n      } finally {\n        retained.release();\n      }\n'''),
          ('''      let candidate: { peer: string; height: number; blocks: unknown[] } | undefined;\n''', '''      let candidate: { peer: string; height: number; blocks: unknown[]; release: () => void } | undefined;\n'''),
          ('''            const blocks = await getJson(\n              `${peer}/blocks?from=${startHeight + 1}&limit=${MAX_SYNC_BLOCKS}`,\n              MAX_SYNC_RESPONSE_BYTES,\n              parsePeerBlockBatch\n            );\n            service.store.chain.validateFinalizedBlock(blocks[0] as Block);\n            return { peer, height: status.height, blocks };\n''', '''            const retained = await getJsonRetained(\n              `${peer}/blocks?from=${startHeight + 1}&limit=${MAX_SYNC_BLOCKS}`,\n              MAX_SYNC_RESPONSE_BYTES,\n              parsePeerBlockBatch\n            );\n            try {\n              service.store.chain.validateFinalizedBlock(retained.value[0] as Block);\n              return { peer, height: status.height, blocks: retained.value, release: retained.release };\n            } catch (error) {\n              retained.release();\n              throw error;\n            }\n'''),
          ('''          if (!candidate && result.value) candidate = result.value;\n''', '''          if (!result.value) continue;\n          if (!candidate) candidate = result.value;\n          else result.value.release();\n'''),
          ('''      let progressed = false;\n      let poisoned = false;\n      for (const block of candidate.blocks) {\n        try {\n          await service.acceptFinalizedBlock(block);\n          accepted += 1;\n          progressed = true;\n        } catch {\n          poisoned = true;\n          break;\n        }\n      }\n      if (poisoned) {\n        await this.recordFailure(candidate.peer, Date.now());\n      } else if (progressed) {\n        this.failureUntil.delete(candidate.peer);\n        await this.peerReputation?.recordSuccess(candidate.peer, Date.now());\n      }\n''', '''      let progressed = false;\n      let poisoned = false;\n      try {\n        for (const block of candidate.blocks) {\n          try {\n            await service.acceptFinalizedBlock(block);\n            accepted += 1;\n            progressed = true;\n          } catch {\n            poisoned = true;\n            break;\n          }\n        }\n        if (poisoned) {\n          await this.recordFailure(candidate.peer, Date.now());\n        } else if (progressed) {\n          this.failureUntil.delete(candidate.peer);\n          await this.peerReputation?.recordSuccess(candidate.peer, Date.now());\n        }\n      } finally {\n        candidate.release();\n      }\n''')]
          for old, new in replacements:
              if old not in s: raise SystemExit('required ownership target not found')
              s = s.replace(old, new, 1)

          marker = 'async function postJson<T = unknown>(\n'
          helper = '''async function getJsonRetained<T>(\n  url: string,\n  maxBytes: number,\n  validate: (value: unknown) => T\n): Promise<{ value: T; release: () => void }> {\n  const response = await fetch(url, {\n    headers: { "x-zyron-rpc-version": String(RPC_API_VERSION) },\n    signal: AbortSignal.timeout(PEER_TIMEOUT_MS)\n  });\n  if (!response.ok) throw new Error(`Peer returned HTTP ${response.status}`);\n  return parseBoundedResponseRetained(response, maxBytes, validate);\n}\n\n'''
          if marker not in s: raise SystemExit('postJson marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = '''async function parseBoundedResponse<T>(\n  response: Response,\n  maxBytes: number,\n  validate: (value: unknown) => T\n): Promise<T> {\n'''
          new = '''async function parseBoundedResponse<T>(\n  response: Response,\n  maxBytes: number,\n  validate: (value: unknown) => T\n): Promise<T> {\n  const retained = await parseBoundedResponseRetained(response, maxBytes, validate);\n  try {\n    return retained.value;\n  } finally {\n    retained.release();\n  }\n}\n\nasync function parseBoundedResponseRetained<T>(\n  response: Response,\n  maxBytes: number,\n  validate: (value: unknown) => T\n): Promise<{ value: T; release: () => void }> {\n'''
          if old not in s: raise SystemExit('parseBoundedResponse target not found')
          s = s.replace(old, new, 1)

          old = '''    const parsed = parsePeerResponseJsonChunks(chunks, total, peerResponseParseByteBudget);\n    releaseDecoded = parsed.release;\n    return validate(parsed.value);\n  } finally {\n    releaseDecoded?.();\n    for (const release of releases) release();\n  }\n}\n'''
          new = '''    const parsed = parsePeerResponseJsonChunks(chunks, total, peerResponseParseByteBudget);\n    releaseDecoded = parsed.release;\n    const value = validate(parsed.value);\n    const retainedRelease = releaseDecoded;\n    releaseDecoded = undefined;\n    return { value, release: retainedRelease };\n  } finally {\n    releaseDecoded?.();\n    for (const release of releases) release();\n  }\n}\n'''
          if old not in s: raise SystemExit('retained return target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('l1/test/peer-response-lease-lifetime.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { dirname, resolve } from "node:path";\nimport test from "node:test";\nimport { fileURLToPath } from "node:url";\n\nconst here = dirname(fileURLToPath(import.meta.url));\nconst source = readFileSync(resolve(here, "../src/node-base.ts"), "utf8");\n\ntest("peer block sync retains decoded-response leases through caller ownership", () => {\n  assert.match(source, /getJsonRetained\\(`\\$\\{base\\}\\/blocks/);\n  assert.match(source, /return \\{ peer, height: status\\.height, blocks: retained\\.value, release: retained\\.release \\}/);\n  assert.match(source, /else result\\.value\\.release\\(\\);/);\n  assert.match(source, /candidate\\.release\\(\\);/);\n});\n\ntest("ordinary peer JSON callers release decoded leases after validation", () => {\n  assert.match(source, /const retained = await parseBoundedResponseRetained\\(response, maxBytes, validate\\);/);\n  assert.match(source, /retained\\.release\\(\\);/);\n});\n''')

          d = Path('docs/PEER_HTTP_JSON_PARSE_BUDGET.md')
          text = d.read_text()
          text = text.replace('After parsing, a conservative decoded-graph allowance derived from twice the wire bytes plus bounded structural cardinality stays reserved through the route-specific validation callback. The transient allowance is released immediately after parsing, while wire and decoded reservations are released after validation or on every failure path.', 'After parsing, a conservative decoded-graph allowance derived from twice the wire bytes plus bounded structural cardinality stays reserved through route-specific validation. For block-sync responses, that decoded lease is transferred with the validated batch and remains held until the caller accepts or discards the batch; concurrent sync probes immediately release every unselected successful candidate. The transient allowance is released immediately after parsing, while wire reservations are released after reading and decoded reservations are released after validation or caller ownership ends.')
          d.write_text(text)
          PY
          git rm .github/workflows/tmp-peer-response-lease-fix.yml .github/workflows/tmp-peer-response-lease-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add l1/src/node-base.ts l1/test/peer-response-lease-lifetime.test.ts docs/PEER_HTTP_JSON_PARSE_BUDGET.md
          git commit -m 'Retain peer response leases through block sync ownership'
          git push origin HEAD:${{ github.head_ref }}
