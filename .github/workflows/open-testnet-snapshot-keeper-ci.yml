name: Open Testnet Snapshot Keeper CI

on:
  pull_request:
    paths:
      - '.github/scripts/open-testnet-snapshot-keeper.mjs'
      - '.github/scripts/test-open-testnet-snapshot-keeper.mjs'
      - '.github/workflows/open-testnet-snapshot-keeper.yml'
      - '.github/workflows/open-testnet-snapshot-keeper-ci.yml'
      # The keeper tests read the cold-start 404 grace from this file.
      - 'l1/scripts/open-testnet.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/open-testnet-snapshot-keeper.mjs'
      - '.github/scripts/test-open-testnet-snapshot-keeper.mjs'
      - '.github/workflows/open-testnet-snapshot-keeper.yml'
      - '.github/workflows/open-testnet-snapshot-keeper-ci.yml'
      # The keeper tests read the cold-start 404 grace from this file.
      - 'l1/scripts/open-testnet.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Keeper rules and workflow policy tests
        run: node --test .github/scripts/test-open-testnet-snapshot-keeper.mjs
