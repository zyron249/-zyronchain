name: Standalone L1 Key Rotation CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validator-key-rotation-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build current binary
        working-directory: l1
        run: npm run build
      - name: Rehearse quorum-authorized validator key rotation
        run: |
          evidence="${RUNNER_TEMP}/zyron-evidence"
          mkdir -p "$evidence"
          node l1/scripts/validator-key-rotation-rehearsal.mjs > "$evidence/result.json"
          node l1/scripts/archive-ci-evidence.mjs --scenario validator-key-rotation --result "$evidence/result.json" --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload validator key rotation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l1-evidence-validator-key-rotation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-evidence/evidence.json
            ${{ runner.temp }}/zyron-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
