name: Miner Release Candidate Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/miner-release-candidate.yml'
      - '.github/scripts/verify-miner-release-candidate-action-custody.mjs'
      - '.github/workflows/miner-release-candidate-action-custody-policy.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/miner-release-candidate.yml'
      - '.github/scripts/verify-miner-release-candidate-action-custody.mjs'
      - '.github/workflows/miner-release-candidate-action-custody-policy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify miner release candidate action custody
        run: node .github/scripts/verify-miner-release-candidate-action-custody.mjs
