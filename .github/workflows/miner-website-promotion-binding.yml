name: Miner Website Promotion Binding CI

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/miner-release-promotion.json'
      - 'scripts/verify-miner-website-promotion-binding.mjs'
      - '.github/workflows/miner-website-promotion-binding.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify website is bound to canonical miner promotion policy
        run: node scripts/verify-miner-website-promotion-binding.mjs
