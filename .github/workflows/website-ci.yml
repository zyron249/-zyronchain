name: ZyronChain Website CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

jobs:
  production-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check browser JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/release.js
          node --check website/wallet.js
          node --check website/validator.js
      - name: Verify production website, wallet and validator contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const required = [
            'website/index.html',
            'website/styles.css',
            'website/app.js',
            'website/release.js',
            'website/README.md',
            'website/robots.txt',
            'website/sitemap.xml',
            'website/favicon.svg',
            'website/logo.svg',
            'website/site.webmanifest',
            'website/wallet.html',
            'website/wallet.css',
            'website/wallet.js',
            'website/validator.html',
            'website/validator.css',
            'website/validator.js'
          ];
          for (const file of required) {
            if (!fs.existsSync(file) || !fs.statSync(file).isFile()) {
              throw new Error(`Missing website file: ${file}`);
            }
          }

          const html = fs.readFileSync('website/index.html', 'utf8');
          const css = fs.readFileSync('website/styles.css', 'utf8');
          const js = fs.readFileSync('website/app.js', 'utf8');
          const releaseJs = fs.readFileSync('website/release.js', 'utf8');
          const walletHtml = fs.readFileSync('website/wallet.html', 'utf8');
          const walletCss = fs.readFileSync('website/wallet.css', 'utf8');
          const walletJs = fs.readFileSync('website/wallet.js', 'utf8');
          const validatorHtml = fs.readFileSync('website/validator.html', 'utf8');
          const validatorCss = fs.readFileSync('website/validator.css', 'utf8');
          const validatorJs = fs.readFileSync('website/validator.js', 'utf8');
          const robots = fs.readFileSync('website/robots.txt', 'utf8');
          const sitemap = fs.readFileSync('website/sitemap.xml', 'utf8');
          const favicon = fs.readFileSync('website/favicon.svg', 'utf8');
          const logo = fs.readFileSync('website/logo.svg', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('website/site.webmanifest', 'utf8'));

          const releaseMatch = releaseJs.match(/const RELEASE_REF = '([0-9a-f]{40})';/);
          if (!releaseMatch) throw new Error('Canonical website release reference is missing or malformed');
          const releaseRef = releaseMatch[1];
          const shaLiterals = releaseJs.match(/[0-9a-f]{40}/g) ?? [];
          if (shaLiterals.length !== 1 || shaLiterals[0] !== releaseRef) {
            throw new Error('website/release.js must contain exactly one canonical 40-hex release SHA');
          }
          execFileSync('git', ['cat-file', '-e', `${releaseRef}^{commit}`], { stdio: 'ignore' });
          execFileSync('git', ['merge-base', '--is-ancestor', releaseRef, 'HEAD'], { stdio: 'ignore' });

          for (const marker of [
            './styles.css',
            './app.js',
            './favicon.svg',
            './logo.svg',
            './wallet.html',
            './validator.html',
            'ZyronChain',
            'Public testnet governance authorized',
            'Authorized does not mean activated',
            '50M ZYN',
            'Create a wallet',
            'No analytics cookies'
          ]) {
            if (!html.includes(marker)) throw new Error(`Website HTML missing required marker: ${marker}`);
          }
          if (/\bV[1-9]\b/.test(html)) {
            throw new Error('Homepage validator visualization must not look like protocol-version labels');
          }

          for (const marker of [
            './styles.css',
            './wallet.css',
            './release.js',
            './wallet.js',
            './logo.svg',
            'ZyronChain Wallet Setup',
            'LOCAL-ONLY WALLET SETUP',
            'NO SECRET IN BROWSER',
            'PRIVATE KEY STAYS LOCAL',
            'PUBLIC_WALLET_RPC_WHEN_PUBLISHED',
            'data-release-short'
          ]) {
            if (!walletHtml.includes(marker)) throw new Error(`Wallet page missing required marker: ${marker}`);
          }

          for (const marker of [
            './validator.css',
            './release.js',
            './validator.js',
            './logo.svg',
            'Validator Launchpad',
            'Private key stays local',
            'Public validator enrollment not active',
            'NO SECRET IN BROWSER',
            'PRIVATE / NON-VALUE',
            'id="release-ref"'
          ]) {
            if (!validatorHtml.includes(marker)) throw new Error(`Validator launchpad missing required marker: ${marker}`);
          }

          const walletReleaseIndex = walletHtml.indexOf('<script src="./release.js"></script>');
          const walletLauncherIndex = walletHtml.indexOf('<script src="./wallet.js"></script>');
          if (walletReleaseIndex < 0 || walletLauncherIndex < 0 || walletReleaseIndex > walletLauncherIndex) {
            throw new Error('Wallet must load canonical release metadata before wallet.js');
          }
          const validatorReleaseIndex = validatorHtml.indexOf('<script src="./release.js"></script>');
          const validatorLauncherIndex = validatorHtml.indexOf('<script src="./validator.js"></script>');
          if (validatorReleaseIndex < 0 || validatorLauncherIndex < 0 || validatorReleaseIndex > validatorLauncherIndex) {
            throw new Error('Validator must load canonical release metadata before validator.js');
          }
          for (const [name, source] of [['wallet.js', walletJs], ['validator.js', validatorJs]]) {
            if (!source.includes('globalThis.ZYRON_RELEASE_REF')) {
              throw new Error(`${name} does not consume the canonical release reference`);
            }
            if (/[0-9a-f]{40}/.test(source)) {
              throw new Error(`${name} must not contain its own hard-coded Git commit SHA`);
            }
          }

          for (const marker of [
            '<link rel="canonical" href="https://zyronchain.com/"',
            '<meta property="og:url" content="https://zyronchain.com/"'
          ]) {
            if (!html.includes(marker)) throw new Error(`Production domain metadata missing: ${marker}`);
          }
          if (!walletHtml.includes('<link rel="canonical" href="https://zyronchain.com/wallet.html"')) {
            throw new Error('Wallet canonical URL is missing');
          }
          if (!validatorHtml.includes('<link rel="canonical" href="https://zyronchain.com/validator.html"')) {
            throw new Error('Validator launchpad canonical URL is missing');
          }

          if (!robots.includes('Sitemap: https://zyronchain.com/sitemap.xml')) {
            throw new Error('robots.txt is not bound to the production sitemap');
          }
          for (const loc of [
            '<loc>https://zyronchain.com/</loc>',
            '<loc>https://zyronchain.com/wallet.html</loc>',
            '<loc>https://zyronchain.com/validator.html</loc>'
          ]) {
            if (!sitemap.includes(loc)) throw new Error(`sitemap.xml missing ${loc}`);
          }

          if (!favicon.includes('<svg') || !favicon.includes('ZyronChain')) {
            throw new Error('ZyronChain SVG favicon contract is invalid');
          }
          if (!logo.includes('<svg') || !logo.includes('ZyronChain') || !logo.includes('VERIFIABLE LAYER-1')) {
            throw new Error('ZyronChain production logo contract is invalid');
          }
          if (manifest.name !== 'ZyronChain' || manifest.start_url !== '/' || manifest.display !== 'standalone') {
            throw new Error('Web manifest contract is invalid');
          }

          if (!css.includes('@media (max-width: 720px)') || !css.includes('@media (prefers-reduced-motion: reduce)')) {
            throw new Error('Website responsive/accessibility boundaries are missing');
          }
          if (!walletCss.includes('@media (max-width: 720px)') || !walletCss.includes('@media (prefers-reduced-motion: reduce)')) {
            throw new Error('Wallet responsive/accessibility boundaries are missing');
          }
          if (!validatorCss.includes('@media (max-width: 640px)')) {
            throw new Error('Validator launchpad mobile boundary is missing');
          }

          const allStaticCss = [css, walletCss, validatorCss].join('\n');
          const definedCssVars = new Set([...allStaticCss.matchAll(/--([a-z0-9-]+)\s*:/gi)].map((match) => match[1]));
          const usedCssVars = new Set([...allStaticCss.matchAll(/var\(--([a-z0-9-]+)/gi)].map((match) => match[1]));
          const missingCssVars = [...usedCssVars].filter((name) => !definedCssVars.has(name));
          if (missingCssVars.length) {
            throw new Error(`Undefined static CSS variables: ${missingCssVars.sort().join(', ')}`);
          }

          const walletMarkRule = walletCss.match(/\.identity-mark img\s*\{([^}]*)\}/s)?.[1] || '';
          if (/clip-path\s*:\s*(?!none)/i.test(walletMarkRule) || /translateX\s*\(/i.test(walletMarkRule)) {
            throw new Error('Wallet identity mark must render as a complete, centered protocol mark');
          }

          const pages = new Map([
            ['website/index.html', html],
            ['website/wallet.html', walletHtml],
            ['website/validator.html', validatorHtml]
          ]);
          for (const [file, source] of pages) {
            if (!/<html\s+lang="en">/i.test(source)) throw new Error(`${file} is missing its language declaration`);
            const ids = [...source.matchAll(/\bid=["']([^"']+)["']/gi)].map((match) => match[1]);
            const duplicateIds = ids.filter((id, index) => ids.indexOf(id) !== index);
            if (duplicateIds.length) throw new Error(`${file} has duplicate id(s): ${[...new Set(duplicateIds)].join(', ')}`);
            const idSet = new Set(ids);

            for (const match of source.matchAll(/\bhref=["']([^"']+)["']/gi)) {
              const href = match[1];
              if (href.startsWith('#')) {
                const target = href.slice(1);
                if (target && !idSet.has(target)) throw new Error(`${file} has broken fragment link: ${href}`);
                continue;
              }
              if (!href.startsWith('./')) continue;
              const [relative, fragment] = href.split('#', 2);
              const targetName = relative === './' || relative === './index.html' ? 'index.html' : relative.slice(2);
              const targetPath = path.join('website', targetName);
              if (!fs.existsSync(targetPath)) throw new Error(`${file} has broken local link: ${href}`);
              if (fragment) {
                const targetSource = fs.readFileSync(targetPath, 'utf8');
                const escaped = fragment.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (!new RegExp(`\\bid=["']${escaped}["']`).test(targetSource)) {
                  throw new Error(`${file} has broken cross-page fragment: ${href}`);
                }
              }
            }

            for (const match of source.matchAll(/\bsrc=["']([^"']+)["']/gi)) {
              const src = match[1];
              if (!src.startsWith('./')) continue;
              const targetPath = path.join('website', src.slice(2));
              if (!fs.existsSync(targetPath)) throw new Error(`${file} has broken local asset: ${src}`);
            }
          }

          if (js.includes('127.0.0.1:9137') || /fetch\s*\(.*9137|WebSocket\s*\(.*9137/.test(js)) {
            throw new Error('Main browser JavaScript must not bind to validator RPC');
          }

          for (const [name, source] of [['release', releaseJs], ['wallet', walletJs], ['validator', validatorJs]]) {
            if (/fetch\s*\(|XMLHttpRequest|WebSocket\s*\(|EventSource\s*\(/.test(source)) {
              throw new Error(`${name} browser JavaScript must remain offline-only`);
            }
            if (/localStorage|sessionStorage|indexedDB/.test(source)) {
              throw new Error(`${name} browser JavaScript must not persist secrets/config in browser storage`);
            }
          }

          if (/type=["']password["']/i.test(walletHtml) || /type=["']file["']/i.test(walletHtml)) {
            throw new Error('Wallet page must not request passwords or wallet-file uploads');
          }
          if (/type=["']password["']/i.test(validatorHtml)) {
            throw new Error('Validator passwords must be requested only by the generated local script');
          }

          for (const marker of [
            'git clone https://github.com/zyron249/-zyronchain.git',
            'checkout --detach',
            'keygen --out wallet.json --password-file wallet.password',
            'chmod 600 wallet.json wallet.password',
            'Read-Host "Choose wallet password (12+ chars)" -AsSecureString',
            'navigator.clipboard',
            'new Blob'
          ]) {
            if (!walletJs.includes(marker)) throw new Error(`Wallet launcher missing security invariant: ${marker}`);
          }

          for (const marker of [
            'git remote set-url origin',
            'git cat-file -e',
            'git rev-parse HEAD',
            'keygen --out',
            'chmod 600',
            '--host 127.0.0.1',
            '--p2p-listen',
            '--p2p-peer',
            'ZYRON_KEYSTORE_PASSWORD_FILE',
            'Genesis contains placeholder values',
            'PUBLIC_KEY_RE',
            'ADDRESS_RE',
            'MAX_SUPPLY_ATOMS',
            'PeerId looks incomplete'
          ]) {
            if (!validatorJs.includes(marker)) throw new Error(`Validator launcher missing security invariant: ${marker}`);
          }

          for (const source of [html, walletHtml, validatorHtml]) {
            if (/<script[^>]+src=['"]https?:\/\//i.test(source)) {
              throw new Error('Production website may not execute third-party remote JavaScript');
            }
            if (/fonts\.googleapis\.com|fonts\.gstatic\.com/i.test(source)) {
              throw new Error('Production website must remain self-contained and not depend on remote web fonts');
            }
          }

          console.log(`website-wallet-validator-contract-ok release=${releaseRef}`);
          NODE
