name: Standalone L1 Validator Clock Concurrency CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validator-clock-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Typecheck
        working-directory: l1
        run: npm run typecheck
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Regress stale signing clock under concurrent signing
        run: |
          set -o pipefail
          node --test l1/dist/test/validator-clock-concurrency.test.js | tee "${RUNNER_TEMP}/validator-clock-concurrency.log"
      - name: Upload clock-concurrency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-validator-clock-concurrency-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validator-clock-concurrency.log
          if-no-files-found: error
          retention-days: 90
