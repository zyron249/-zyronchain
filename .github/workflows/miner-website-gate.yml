name: Miner Website Fail-Closed Gate CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/miner-website-gate.yml'

permissions:
  contents: read

jobs:
  fail-closed-miner-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify miner website remains fail-closed
        run: |
          node --check website/app.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('website/mining.html', 'utf8');
          const js = fs.readFileSync('website/app.js', 'utf8');

          for (const marker of ['Mining Launchpad', 'id="start"', 'ACTIVATION GATED', 'Encrypted key custody is mandatory']) {
            if (!html.includes(marker)) throw new Error(`Mining page missing ${marker}`);
          }
          if (!html.includes("connect-src 'none'")) throw new Error('Mining CSP must keep connect-src none');

          for (const marker of [
            'MINER_DISTRIBUTION',
            'enabled: false',
            'publicMiningActivated: false',
            'assets: Object.freeze({ windows: null, macos: null, linux: null })',
            'assetSha256: Object.freeze({ windows: null, macos: null, linux: null })',
            'Miner download not yet activated',
            'Expected SHA-256 will be published only with an activated reviewed release.',
            'ACTIVATION GATED',
            'navigator.userAgentData',
            'github\\.com\\/zyron249\\/-zyronchain\\/releases\\/download',
            '/^[0-9a-f]{64}$/'
          ]) {
            if (!js.includes(marker)) throw new Error(`Miner website gate missing ${marker}`);
          }

          if (/fetch\s*\(|XMLHttpRequest|WebSocket\s*\(|EventSource\s*\(/.test(js)) {
            throw new Error('Miner website must not fetch distribution/custody state over the network');
          }
          if (/localStorage|sessionStorage|indexedDB/.test(js)) {
            throw new Error('Miner website must not persist custody/distribution state');
          }
          if (!js.includes('never requests a private key, seed phrase, wallet password')) {
            throw new Error('Miner website must state the no-secret boundary');
          }
          if (/enabled:\s*true|publicMiningActivated:\s*true/.test(js)) {
            throw new Error('Public miner download must remain activation-gated in this preparatory PR');
          }
          if (/assets:\s*Object\.freeze\(\{[^}]*https:\/\//s.test(js)) {
            throw new Error('Preparatory PR must not bind downloadable release assets');
          }
          if (/assetSha256:\s*Object\.freeze\(\{[^}]*[0-9a-f]{64}/s.test(js)) {
            throw new Error('Preparatory PR must not bind release digests before activation');
          }
          NODE
