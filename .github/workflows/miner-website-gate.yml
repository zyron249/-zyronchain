name: Miner Website Fail-Closed Gate CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/miner-website-gate.yml'

permissions:
  contents: read

jobs:
  fail-closed-miner-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify miner website remains fail-closed
        run: |
          node --check website/app.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('website/mining.html', 'utf8');
          const js = fs.readFileSync('website/app.js', 'utf8');

          // Mining is retired (owner decision 2026-09-30). The historical page stays noindex and unlinked, and the site
          // script carries no miner distribution, download or activation code at all (stronger than a disabled one).
          for (const marker of ['Mining is retired', '<meta name="robots" content="noindex" />', 'id="start"', 'Encrypted key custody is mandatory']) {
            if (!html.includes(marker)) throw new Error(`Mining page missing ${marker}`);
          }
          if (!html.includes("connect-src 'none'")) throw new Error('Mining CSP must keep connect-src none');
          if (/MINER_DISTRIBUTION|ZyronMiner|releases\/download|Download Zyron Miner|location\.assign/.test(js)) {
            throw new Error('Mining is retired: website/app.js must not carry a miner download path');
          }

          if (/fetch\s*\(|XMLHttpRequest|WebSocket\s*\(|EventSource\s*\(/.test(js)) {
            throw new Error('Miner website must not fetch distribution/custody state over the network');
          }
          if (/localStorage|sessionStorage|indexedDB/.test(js)) {
            throw new Error('Miner website must not persist custody/distribution state');
          }
          if (/enabled:\s*true|publicMiningActivated:\s*true/.test(js)) {
            throw new Error('Public miner download must never be activated from the website (mining is retired)');
          }
          NODE
