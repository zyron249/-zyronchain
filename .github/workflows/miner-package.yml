name: Miner Package CI

on:
  pull_request:
    paths:
      - 'l1/**'
      - '.github/workflows/miner-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable-miner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        node: [22, 24]
        # The full L1 regression suite runs as round-robin shards of the
        # compiled test files (l1/scripts/l1-test-shard.mjs). On every
        # durability-capable runner, shards 1..N together run every test file
        # exactly once; keep this list equal to 1..N for the N used in
        # L1_TEST_SHARD below. Windows runs only its miner-specific
        # regressions, so it needs a single job.
        shard: [1, 2]
        exclude:
          - os: windows-2022
            shard: 2
    runs-on: ${{ matrix.os }}
    # The full L1 suite on macos-15 arm64 used about 19 minutes of the previous
    # 20-minute budget, and the job was cancelled during candidate packaging
    # after that suite had already passed. 40 minutes leaves room for packaging.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check miner script syntax
        run: |
          node --check scripts/mine.mjs
          node --check scripts/miner-launcher.mjs
          node --check scripts/miner-launcher-security.mjs
          node --check scripts/test-miner-launcher-security.mjs
          node --check scripts/package-miner.mjs
          node --check scripts/materialize-miner-package-posix.mjs
          node --check scripts/test-miner-package-materializer-posix.mjs
          node --check scripts/miner-packaging-custody-gate.mjs
          node --check scripts/test-miner-packaging-quarantine.mjs
          node --check scripts/test-miner-handle-custody-posix.mjs
          node --check scripts/generate-miner-sha256sums.mjs
          node --check scripts/test-miner-release-manifest.mjs
          node --check scripts/test-miner-release-manifest-snapshot.mjs
          node --check scripts/test-miner-release-manifest-root-relative.mjs
          node --check scripts/test-miner-release-manifest-path-controls.mjs
          node --check scripts/test-miner-release-manifest-verify.mjs
          node --check scripts/miner-candidate-integrity.mjs
          node --check scripts/test-miner-candidate-integrity.mjs
      - name: Run miner launcher custody security regression
        run: node scripts/test-miner-launcher-security.mjs
      - name: Run miner release manifest regressions
        run: |
          node scripts/test-miner-release-manifest.mjs
          node scripts/test-miner-release-manifest-snapshot.mjs
          node scripts/test-miner-release-manifest-root-relative.mjs
          node scripts/test-miner-release-manifest-path-controls.mjs
          node scripts/test-miner-release-manifest-verify.mjs
          node scripts/test-miner-candidate-integrity.mjs
      - name: Assert inactive miner network profile
        run: node -e "const p=require('./miner-network-profile.json'); if (p.publicMiningActivated !== false || p.rpcUrl !== null || p.genesisFile !== null) throw new Error('miner network profile must remain fail-closed before intentional activation')"
      - name: Exercise descriptor-relative miner custody primitive
        run: node scripts/test-miner-handle-custody-posix.mjs
      - name: Exercise descriptor-relative miner package materializer
        run: node scripts/test-miner-package-materializer-posix.mjs
      - name: Build runtime
        run: npm run build
      - name: Alias 127.0.0.2 on loopback for real-socket RPC identity tests (macOS)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Run full L1 regression suite on durability-capable runners
        if: runner.os != 'Windows'
        env:
          L1_TEST_SHARD: ${{ matrix.shard }}/2
        run: npm test
      - name: Run Windows miner-specific regressions
        if: runner.os == 'Windows'
        run: node --test dist/test/miner-genesis.test.js dist/test/miner-network.test.js dist/test/miner-security.test.js
      - name: Prove package materialization is quarantined before filesystem writes
        run: node scripts/test-miner-packaging-quarantine.mjs
      - name: Construct and verify audited POSIX candidate integrity
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir miner-release
          node scripts/package-miner.mjs
          candidate="$(find miner-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$candidate"
          test -f "$candidate/candidate-integrity.json"
          node --input-type=module -e "import { verifyCandidateIntegrity } from './scripts/miner-candidate-integrity.mjs'; verifyCandidateIntegrity(process.argv[1]);" "$candidate"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1]+'/candidate-integrity.json','utf8')); if(p.sourceCommit!==process.env.GITHUB_SHA) throw new Error('candidate integrity sourceCommit must bind exact workflow SHA')" "$candidate"
          node scripts/generate-miner-sha256sums.mjs "$candidate"
          test -f "$candidate/SHA256SUMS"
          node --input-type=module -e "import { verifyMinerSha256Sums } from './scripts/generate-miner-sha256sums.mjs'; verifyMinerSha256Sums(process.argv[1]);" "$candidate"
