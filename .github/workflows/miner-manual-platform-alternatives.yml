name: Miner Manual Platform Alternatives CI

on:
  pull_request:
    paths:
      - 'website/mining.html'
      - 'website/app.js'
      - 'website/test-miner-platform-alternatives.mjs'
      - '.github/workflows/miner-manual-platform-alternatives.yml'

permissions:
  contents: read

jobs:
  manual-platforms-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify manual platform alternatives remain fail-closed
        run: node website/test-miner-platform-alternatives.mjs
