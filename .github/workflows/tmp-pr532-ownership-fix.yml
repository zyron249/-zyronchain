name: Temporary PR 532 ownership fix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'l1/scripts/tmp-pr532-ownership-fix.mjs'
      - '.github/workflows/tmp-pr532-ownership-fix.yml'
      - 'l1/src/node-base.ts'
      - 'docs/PEER_HTTP_JSON_PARSE_BUDGET.md'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/peer-response-json-parse-budget-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/peer-response-json-parse-budget-v2
          persist-credentials: true
      - name: Apply focused ownership patch
        run: node l1/scripts/tmp-pr532-ownership-fix.mjs
      - name: Commit focused changes and remove temporary patcher
        run: |
          git config user.name 'Zyron Chain'
          git config user.email 'ciyagerkurdi@icloud.com'
          git add -A
          git diff --cached --exit-code && { echo 'patcher made no changes' >&2; exit 1; } || true
          git commit -m 'Retain peer response leases through block sync ownership'
          git push origin HEAD:agent/peer-response-json-parse-budget-v2
