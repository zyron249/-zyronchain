name: Agent 845 Legacy Signer Fixture Migration

on:
  push:
    branches:
      - agent/remote-signer-auth-boundary-v1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-signer-auth-boundary-v1
          fetch-depth: 0
      - name: Migrate legacy remote signer fixtures
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'l1/test/l1.test.ts';
          let text = fs.readFileSync(path, 'utf8');
          const marker = 'const execFileAsync = promisify(execFile);\n';
          const declaration = 'const remoteSignerTestToken = "remote-signer-legacy-test-token-".padEnd(64, "x");\n';
          if (!text.includes(marker)) throw new Error('legacy signer fixture marker not found');
          if (text.includes(declaration)) throw new Error('legacy signer fixture token already present');
          text = text.replace(marker, marker + declaration);

          const loopback = 'new RemoteValidatorSigner(`http://127.0.0.1:${address.port}/sign`, validatorOnePublic)';
          const loopbackReplacement = 'new RemoteValidatorSigner(`http://127.0.0.1:${address.port}/sign`, validatorOnePublic, remoteSignerTestToken)';
          const loopbackCount = text.split(loopback).length - 1;
          if (loopbackCount !== 3) throw new Error(`expected 3 legacy loopback signer fixtures, found ${loopbackCount}`);
          text = text.split(loopback).join(loopbackReplacement);

          const unsafe = 'new RemoteValidatorSigner("http://192.0.2.10/sign", validatorOnePublic)';
          const unsafeReplacement = 'new RemoteValidatorSigner("http://192.0.2.10/sign", validatorOnePublic, remoteSignerTestToken)';
          const unsafeCount = text.split(unsafe).length - 1;
          if (unsafeCount !== 1) throw new Error(`expected 1 unsafe-endpoint signer fixture, found ${unsafeCount}`);
          text = text.replace(unsafe, unsafeReplacement);

          if (text.includes(loopback) || text.includes(unsafe)) throw new Error('legacy unauthenticated signer fixture remains');
          fs.writeFileSync(path, text, 'utf8');
          NODE
          git diff --check
          git diff -- l1/test/l1.test.ts
      - name: Commit fixture migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add l1/test/l1.test.ts
          git commit -m 'test: authenticate legacy remote signer fixtures'
          git push origin HEAD:agent/remote-signer-auth-boundary-v1
