name: Miner Website Gate Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/miner-website-gate.yml'
      - '.github/workflows/miner-website-gate-action-custody-policy.yml'
      - 'scripts/verify-miner-website-gate-action-custody.mjs'
      - 'docs/MINER_WEBSITE_GATE_ACTION_CUSTODY.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify miner website gate custody policy
        run: node scripts/verify-miner-website-gate-action-custody.mjs
