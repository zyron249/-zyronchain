name: Canonical Genesis Message CI

on:
  pull_request:
    paths:
      - 'l1/genesis-message.json'
      - 'l1/scripts/verify-genesis-message.mjs'
      - 'docs/GENESIS_MESSAGE.md'
      - '.github/workflows/genesis-message-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact UTF-8 genesis message contract
        run: node l1/scripts/verify-genesis-message.mjs
