name: Canonical Genesis Message CI

on:
  pull_request:
    paths:
      - 'l1/genesis-message.json'
      - 'l1/scripts/verify-genesis-message.mjs'
      - 'docs/GENESIS_MESSAGE.md'
      - '.github/workflows/genesis-message-ci.yml'
      - '.github/workflows/genesis-message-action-custody-policy.yml'
      - '.github/scripts/verify-genesis-message-action-custody.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact UTF-8 genesis message contract
        run: node l1/scripts/verify-genesis-message.mjs
