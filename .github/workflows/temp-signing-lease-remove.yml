name: Temporary Legacy Signing Lease Test Remover

on:
  push:
    branches:
      - agent/signing-lease-remove-legacy-v1
    paths:
      - '.github/workflows/temp-signing-lease-remove.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/signing-lease-remove-legacy-v1
          fetch-depth: 0

      - name: Remove exact legacy process-racy duplicate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'l1/test/l1.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const title = 'signing journal releases its writer lease after hard crash without losing the reserved choice';
          const startMarker = `test("${title}", async () => {`;
          const nextMarker = 'test("signing journal write uncertainty fail-stops all later validator choices", async () => {';
          const start = source.indexOf(startMarker);
          if (start < 0 || source.indexOf(startMarker, start + 1) >= 0) {
            throw new Error('legacy signing-lease test marker must exist exactly once');
          }
          const next = source.indexOf(nextMarker, start);
          if (next < 0) throw new Error('next signing-journal test marker not found');
          const before = source.slice(0, start);
          const after = source.slice(next);
          const updated = `${before}${after}`;
          if (updated.includes(title)) throw new Error('legacy signing-lease title remains after patch');
          fs.writeFileSync(path, updated);
          NODE

      - name: Commit branch-only patch
        shell: bash
        run: |
          git config user.name 'Zyron Chain'
          git config user.email 'ciyagerkurdi@icloud.com'
          git add l1/test/l1.test.ts
          git diff --cached --check
          git commit -m 'Remove legacy process-racy signing lease test'
          git push origin HEAD:agent/signing-lease-remove-legacy-v1
