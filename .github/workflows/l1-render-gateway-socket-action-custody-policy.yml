name: Render Gateway Socket Red-Team Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-render-gateway-socket-redteam.yml'
      - '.github/workflows/l1-render-gateway-socket-action-custody-policy.yml'
      - 'l1/scripts/verify-render-gateway-socket-action-custody.mjs'
      - 'docs/RENDER_GATEWAY_SOCKET_EVIDENCE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/l1-render-gateway-socket-redteam.yml'
      - '.github/workflows/l1-render-gateway-socket-action-custody-policy.yml'
      - 'l1/scripts/verify-render-gateway-socket-action-custody.mjs'
      - 'docs/RENDER_GATEWAY_SOCKET_EVIDENCE.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify gateway socket action custody
        run: node l1/scripts/verify-render-gateway-socket-action-custody.mjs
