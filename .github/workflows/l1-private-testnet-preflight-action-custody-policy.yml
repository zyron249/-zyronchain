name: Private Testnet Preflight Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-private-testnet-preflight.yml'
      - '.github/workflows/l1-private-testnet-preflight-action-custody-policy.yml'
      - '.github/scripts/verify-l1-private-testnet-preflight-action-custody.mjs'
      - 'docs/L1_PRIVATE_TESTNET_PREFLIGHT_ACTION_CUSTODY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify private-testnet preflight action custody
        run: node .github/scripts/verify-l1-private-testnet-preflight-action-custody.mjs
