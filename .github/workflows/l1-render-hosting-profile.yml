name: Standalone L1 Render Hosting Profile Policy CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  render-hosting-profile-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify Free profile remains smoke-only
        run: |
          evidence="${RUNNER_TEMP}/zyron-render-hosting-profile"
          mkdir -p "$evidence"
          node l1/scripts/verify-render-hosting-profile.mjs \
            --policy docs/l1-render-hosting-profile.json \
            --docs docs/RENDER_PRIVATE_TESTNET.md \
            --out "$evidence/result.json" \
            --commit-sha "$GITHUB_SHA"
          cp docs/l1-render-hosting-profile.json "$evidence/policy.json"
          cd "$evidence"
          sha256sum result.json policy.json > SHA256SUMS
          cat result.json
      - name: Upload hosting-profile evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-render-hosting-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-render-hosting-profile/result.json
            ${{ runner.temp }}/zyron-render-hosting-profile/policy.json
            ${{ runner.temp }}/zyron-render-hosting-profile/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
