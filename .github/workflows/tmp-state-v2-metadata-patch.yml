name: Temporary State-v2 Metadata Patcher

on:
  push:
    branches:
      - agent/state-v2-metadata-bounded-reader-v1
    paths:
      - 'l1/scripts/patch-state-v2-metadata-reader.mjs'
      - '.github/workflows/tmp-state-v2-metadata-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/state-v2-metadata-bounded-reader-v1
      - name: Apply exact patch
        run: node l1/scripts/patch-state-v2-metadata-reader.mjs
      - name: Remove temporary patch machinery
        run: rm l1/scripts/patch-state-v2-metadata-reader.mjs .github/workflows/tmp-state-v2-metadata-patch.yml
      - name: Commit branch-only patch
        run: |
          git config user.name 'ZyronChain Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add l1/src/state-v2-store.ts l1/test/state-v2-metadata-security.test.ts l1/scripts/patch-state-v2-metadata-reader.mjs .github/workflows/tmp-state-v2-metadata-patch.yml
          git commit -m 'Harden State-v2 metadata file custody'
          git push origin HEAD:agent/state-v2-metadata-bounded-reader-v1
