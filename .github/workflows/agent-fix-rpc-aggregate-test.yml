name: Agent Fix RPC Aggregate Budget Regression

on:
  push:
    branches:
      - agent/rpc-json-parse-budget-v2
    paths:
      - .github/workflows/agent-fix-rpc-aggregate-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpc-json-parse-budget-v2
          persist-credentials: true
      - name: Patch regression and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('l1/test/l1.test.ts')
          text = path.read_text()
          start_marker = 'test("RPC aggregate request-body budget sheds concurrent body memory pressure", async () => {'
          end_marker = 'test("RPC global inflight budget rejects excess concurrent work", async () => {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          replacements = {
              'maxInflightRequestBodyBytes: 1_000': 'maxInflightRequestBodyBytes: 10_000',
              '"Content-Length: 1000"': '"Content-Length: 10000"',
              'assert.equal(metricsPayload.rpc.maxRequestBodyBytes, 1_000);': 'assert.equal(metricsPayload.rpc.maxRequestBodyBytes, 10_000);',
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old!r} in target test, got {block.count(old)}')
              block = block.replace(old, new)
          path.write_text(text[:start] + block + text[end:])
          PY
          rm .github/workflows/agent-fix-rpc-aggregate-test.yml
          git config user.name "Zyron Chain"
          git config user.email "ciyagerkurdi@icloud.com"
          git add l1/test/l1.test.ts .github/workflows/agent-fix-rpc-aggregate-test.yml
          git commit -m "Align aggregate RPC budget regression with parse accounting"
          git push origin HEAD:agent/rpc-json-parse-budget-v2
