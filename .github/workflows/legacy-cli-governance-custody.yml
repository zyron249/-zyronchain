name: Legacy CLI Governance File Custody CI

on:
  pull_request:
    paths:
      - 'l1/src/cli.ts'
      - 'l1/src/cli-governance-file.ts'
      - 'l1/test/legacy-cli-governance-file.test.ts'
      - 'docs/GOVERNANCE_FILE_CUSTODY.md'
      - '.github/workflows/legacy-cli-governance-custody.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Typecheck
        working-directory: l1
        run: npm run typecheck
      - name: Build
        working-directory: l1
        run: npm run build
      - name: Run direct legacy governance custody regressions
        working-directory: l1
        run: node --test dist/test/cli-governance-file.test.js dist/test/legacy-cli-governance-file.test.js
