name: Render Memory Soak Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-render-memory-soak.yml'
      - '.github/workflows/l1-render-memory-soak-action-custody-policy.yml'
      - 'l1/scripts/verify-render-memory-soak-action-custody.mjs'
      - 'docs/RENDER_MEMORY_SOAK_ACTION_CUSTODY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify memory-soak action custody
        working-directory: l1
        run: node scripts/verify-render-memory-soak-action-custody.mjs
