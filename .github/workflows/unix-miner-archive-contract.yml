name: Unix Miner Archive Contract CI

on:
  pull_request:
    paths:
      - 'l1/scripts/package-unix-miner-tarball.mjs'
      - 'l1/scripts/copy-unix-miner-readme.mjs'
      - 'l1/scripts/README-unix-miner-package.txt'
      - 'l1/scripts/verify-unix-miner-tarball.sh'
      - 'l1/scripts/test-unix-miner-package-contract.mjs'
      - 'docs/UNIX_MINER_DISTRIBUTION.md'
      - 'docs/UNIX_MINER_CONTRACT_ACTION_CUSTODY.md'
      - '.github/workflows/unix-miner-archive-candidate.yml'
      - '.github/workflows/unix-miner-archive-contract.yml'
      - '.github/workflows/unix-miner-archive-contract-action-custody-policy.yml'
      - 'scripts/verify-unix-miner-archive-contract-action-custody.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Verify Unix archive contract
        working-directory: l1
        run: node scripts/test-unix-miner-package-contract.mjs
