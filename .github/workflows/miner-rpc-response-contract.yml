name: Miner RPC Response Contract CI

on:
  pull_request:
    paths:
      - 'l1/scripts/mine.mjs'
      - 'l1/scripts/miner-rpc-response.mjs'
      - 'l1/scripts/test-miner-rpc-response.mjs'
      - 'l1/scripts/package-miner.mjs'
      - 'docs/MINER_RPC_RESPONSE_SECURITY.md'
      - '.github/workflows/miner-rpc-response-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Verify miner RPC response parser
        working-directory: l1
        run: node scripts/test-miner-rpc-response.mjs

      - name: Verify miner scripts parse
        working-directory: l1
        run: |
          node --check scripts/miner-rpc-response.mjs
          node --check scripts/mine.mjs
          node --check scripts/package-miner.mjs
