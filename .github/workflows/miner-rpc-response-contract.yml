name: Miner RPC Response Contract CI

on:
  pull_request:
    paths:
      - 'l1/scripts/mine.mjs'
      - 'l1/scripts/miner-rpc-response.mjs'
      - 'l1/scripts/test-miner-rpc-response.mjs'
      - 'l1/scripts/package-miner.mjs'
      - 'l1/scripts/materialize-miner-package-posix.mjs'
      - 'docs/MINER_RPC_RESPONSE_SECURITY.md'
      - '.github/workflows/miner-rpc-response-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Verify miner RPC response parser
        working-directory: l1
        run: node scripts/test-miner-rpc-response.mjs

      - name: Verify miner scripts parse
        working-directory: l1
        run: |
          node --check scripts/miner-rpc-response.mjs
          node --check scripts/mine.mjs
          node --check scripts/package-miner.mjs
          node --check scripts/materialize-miner-package-posix.mjs