name: Maintainer Succession Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-succession-policy.yml'
      - '.github/workflows/l1-succession-action-custody-policy.yml'
      - 'l1/scripts/verify-maintainer-succession-action-custody.mjs'
      - 'docs/L1_MAINTAINER_SUCCESSION.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/l1-succession-policy.yml'
      - '.github/workflows/l1-succession-action-custody-policy.yml'
      - 'l1/scripts/verify-maintainer-succession-action-custody.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify maintainer succession action custody
        run: node l1/scripts/verify-maintainer-succession-action-custody.mjs
