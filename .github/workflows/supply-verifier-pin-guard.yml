name: Supply Verifier Pin Guard (main checker)

# Guards tools/supply-verifier/EXPECTED_SHA256 (docs/SUPPLY_VERIFIER.md,
# "Pin guard"). pull_request_target on PRs into main only: GitHub runs THIS
# file and the checker exactly as they are on main, so a PR cannot edit or
# disable the check it is judged by. labeled/unlabeled re-run it when the
# approval label changes. main's TypeScript is installed from MAIN's
# l1/package-lock.json with --ignore-scripts BEFORE any PR data is fetched.
# The PR head is then fetched as git data only and read with git show / git
# diff; the checker rebuilds the tar from those bytes with main's tsconfig,
# TypeScript and build/hash scripts. Nothing from the PR is checked out,
# installed or executed. Labels are read from the event payload. No secrets
# are used, the token is read-only and never persisted. The checker must
# exist on main: if it is missing, throws or exits non-zero, the job FAILS.
# Toolchain rules (Patron, 2026-11-10):
# - The install uses MAIN's l1/package-lock.json only. There is never a
#   fallback to the PR's lockfile or package.json.
# - The checker fails closed when the PR changes the TypeScript toolchain in
#   l1/package-lock.json, changes l1/tsconfig.json, or does not compile
#   against main's dependencies. The label does not override this.
# - Such toolchain PRs land on their own, with Security's independent rebuild.
# .github/scripts/verify-supply-verifier-pin-guard-custody.mjs pins the exact
# shape of this file; change both together.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supply-verifier-pin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (trusted checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/supply-verifier/.nvmrc
      - name: Install main's l1 TypeScript toolchain (main's lockfile, no install scripts)
        working-directory: l1
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the PR head pin against the merge base with main (data only)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main' "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          if [ ! -f .github/scripts/verify-supply-verifier-pin-guard.mjs ]; then
            echo "::error::main has no .github/scripts/verify-supply-verifier-pin-guard.mjs; the pin guard cannot run"
            exit 1
          fi
          node .github/scripts/verify-supply-verifier-pin-guard.mjs --merge-base origin/main --head "$PR_HEAD_SHA" --event "$GITHUB_EVENT_PATH" --toolchain l1/node_modules --scratch "$RUNNER_TEMP/pin-guard"
