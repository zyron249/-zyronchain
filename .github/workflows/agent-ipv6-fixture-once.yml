name: Agent IPv6 fixture one-shot

on:
  push:
    branches:
      - agent/http-ipv6-diversity-prefix-v1
    paths:
      - .github/workflows/agent-ipv6-fixture-once.yml

permissions:
  contents: write

jobs:
  align-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/http-ipv6-diversity-prefix-v1
          fetch-depth: 0
      - name: Replace stale IPv6 expectation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('l1/test/l1.test.ts')
          text = path.read_text()
          old = 'assert.equal(peerDiversityBucket("https://[2001:db8::1]:9137"), "ipv6:2001:db8::1");'
          new = 'assert.equal(peerDiversityBucket("https://[2001:db8::1]:9137"), "ipv6:2001:0db8:0000:0000/64");'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale IPv6 fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/agent-ipv6-fixture-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add l1/test/l1.test.ts .github/workflows/agent-ipv6-fixture-once.yml
          git diff --cached --check
          git commit -m 'Align legacy IPv6 diversity fixture'
          git push origin HEAD:agent/http-ipv6-diversity-prefix-v1
