name: Agent Open Recovery PR v2

on:
  push:
    branches:
      - agent/chain-control-metadata-bounded-read-v1
    paths:
      - .github/workflows/agent-open-recovery-pr-v2.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chain-control-metadata-bounded-read-v1
          fetch-depth: 0
      - name: Open pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          req = urllib.request.Request(f'{api}/pulls?head=zyron249:agent/chain-control-metadata-bounded-read-v1&base=main&state=open', headers=headers)
          with urllib.request.urlopen(req) as response:
              existing = json.load(response)
          if not existing:
              payload = json.dumps({
                  'title': 'Recovery metadata read limits',
                  'head': 'agent/chain-control-metadata-bounded-read-v1',
                  'base': 'main',
                  'body': 'Closes #350. Bounds small chain control-file reads and adds focused regression coverage and recovery documentation.'
              }).encode()
              req = urllib.request.Request(f'{api}/pulls', data=payload, headers=headers, method='POST')
              with urllib.request.urlopen(req) as response:
                  pr = json.load(response)
              print(f"opened PR #{pr['number']}")
          else:
              print(f"PR already open #{existing[0]['number']}")
          PY
      - name: Remove one-shot workflows
        run: |
          rm -f .github/workflows/agent-open-recovery-pr.yml .github/workflows/agent-open-recovery-pr-v2.yml
          git config user.name 'zyron249'
          git config user.email '208641275+zyron249@users.noreply.github.com'
          git add -A .github/workflows
          git diff --cached --quiet || git commit -m 'Remove one-shot PR workflows'
          git push origin HEAD:agent/chain-control-metadata-bounded-read-v1
