name: Website CI Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/website-ci.yml'
      - '.github/workflows/miner-website-promotion-binding.yml'
      - '.github/workflows/miner-manual-platform-alternatives.yml'
      - '.github/workflows/website-ci-action-custody-policy.yml'
      - 'scripts/verify-website-ci-action-custody.mjs'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify website workflow action custody
        run: node scripts/verify-website-ci-action-custody.mjs
