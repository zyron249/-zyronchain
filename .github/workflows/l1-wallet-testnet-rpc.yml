name: Wallet Testnet RPC Smoke CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  wallet-testnet-rpc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: zyron_testnet
          POSTGRES_PASSWORD: zyron_testnet
          POSTGRES_DB: zyron_wallet_testnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zyron_testnet -d zyron_wallet_testnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Separate role and database from the game CI database.
      ZYRON_TESTNET_DATABASE_URL: postgresql://zyron_testnet:zyron_testnet@127.0.0.1:5432/zyron_wallet_testnet
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Faucet, transfer, CORS and endpoint allowlist smoke
        run: node l1/scripts/public-testnet-rpc.mjs --smoke
        env:
          ZYRON_TESTNET_DATABASE_URL: ""
      - name: Durable restart simulation
        run: node l1/scripts/test-wallet-testnet-durable.mjs
