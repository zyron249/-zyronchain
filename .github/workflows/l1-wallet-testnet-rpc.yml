name: Wallet Testnet RPC Smoke CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  wallet-testnet-rpc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Faucet, transfer, CORS and endpoint allowlist smoke
        run: node l1/scripts/public-testnet-rpc.mjs --smoke
