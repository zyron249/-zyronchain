name: Unix Miner Archive Contract Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/unix-miner-archive-contract.yml'
      - '.github/workflows/unix-miner-archive-contract-action-custody-policy.yml'
      - '.github/scripts/verify-unix-miner-archive-contract-action-custody.mjs'
      - 'docs/UNIX_MINER_CONTRACT_ACTION_CUSTODY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Verify Unix miner archive contract action custody
        run: node .github/scripts/verify-unix-miner-archive-contract-action-custody.mjs
