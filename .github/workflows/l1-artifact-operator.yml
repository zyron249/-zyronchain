name: Standalone L1 Release Artifact Operator CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  artifact-operator-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked source dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical release files
        working-directory: l1
        run: npm run build
      - name: Rehearse a clean operator install from the packed artifact
        run: |
          set -o pipefail
          node l1/scripts/artifact-operator-rehearsal.mjs | tee "${RUNNER_TEMP}/artifact-operator-rehearsal.json"
      - name: Upload operator rehearsal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-artifact-operator-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-operator-rehearsal.json
          if-no-files-found: error
          retention-days: 90
