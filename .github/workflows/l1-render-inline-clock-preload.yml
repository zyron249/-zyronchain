name: Standalone L1 Render Inline Clock Monitor CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  render-inline-clock-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Rehearse inline fail-closed clock monitor
        run: |
          set -o pipefail
          node l1/scripts/render-clock-preload-rehearsal.mjs | tee "${RUNNER_TEMP}/render-inline-clock-monitor.json"
      - name: Verify preload is harmless for ordinary build commands
        working-directory: l1
        env:
          NODE_OPTIONS: --import=./scripts/render-clock-preload.mjs
        run: npm run typecheck
      - name: Upload inline monitor evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l1-render-inline-clock-monitor-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-inline-clock-monitor.json
          if-no-files-found: error
          retention-days: 90
