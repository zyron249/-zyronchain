name: Branch-only legacy governance custody patcher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/patch-legacy-governance-custody.mjs'
      - '.github/workflows/patch-legacy-governance-custody.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/legacy-governance-file-custody-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/legacy-governance-file-custody-v1
          persist-credentials: true
      - name: Apply reviewed branch patch
        run: node .github/scripts/patch-legacy-governance-custody.mjs
      - name: Commit production changes and self-delete patcher
        run: |
          git config user.name "Zyron Chain"
          git config user.email "ciyagerkurdi@icloud.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden direct legacy governance file reads"
          git push origin HEAD:agent/legacy-governance-file-custody-v1
