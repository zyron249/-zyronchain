name: Miner Release Candidate CI

on:
  pull_request:
    paths:
      - 'l1/**'
      - '.github/workflows/miner-release-candidate.yml'
  workflow_dispatch:
  push:
    tags:
      - 'miner-v*'

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical miner runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: l1/package-lock.json

      - name: Verify runtime pin
        shell: bash
        run: |
          test "$(node -p 'process.version')" = 'v22.23.2'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check fail-closed miner bootstrap
        run: |
          node --check scripts/mine.mjs
          node --check scripts/miner-launcher.mjs
          node --check scripts/miner-launcher-security.mjs
          node --check scripts/test-miner-launcher-security.mjs
          node --check scripts/package-miner.mjs
          node --check scripts/test-windows-miner-package-contract.mjs
          node scripts/test-miner-launcher-security.mjs
          node scripts/test-windows-miner-package-contract.mjs
          node -e "const p=require('./miner-network-profile.json'); if (p.publicMiningActivated !== false || p.rpcUrl !== null || p.genesisFile !== null) throw new Error('release candidate profile must remain fail-closed')"

      - name: Build runtime
        run: npm run build

      - name: Run full L1 regression suite on durability-capable runners
        if: runner.os != 'Windows'
        run: npm test

      - name: Run Windows miner-specific regressions
        if: runner.os == 'Windows'
        run: node --test dist/test/miner-genesis.test.js dist/test/miner-network.test.js dist/test/miner-security.test.js

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate production SBOM before pruning development dependencies
        shell: bash
        run: |
          node -e "require('node:fs').mkdirSync('miner-release',{recursive:true})"
          npm sbom --omit=dev --sbom-format=spdx > miner-release/SBOM.spdx.json

      - name: Prune to production runtime
        run: npm prune --omit=dev

      - name: Package self-contained miner
        run: node scripts/package-miner.mjs

      - name: Add Windows start instructions
        if: runner.os == 'Windows'
        run: node scripts/copy-windows-miner-readme.mjs

      - name: Package Windows end-user ZIP
        if: runner.os == 'Windows'
        run: node scripts/package-windows-miner-zip.mjs

      - name: Verify Windows ZIP contains double-click launcher and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-miner-zip.ps1

      - name: Verify inactive candidate fails closed before custody
        shell: bash
        run: |
          BUNDLE=$(find miner-release -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$BUNDLE" ]; then echo 'missing miner bundle' >&2; exit 1; fi
          TEST_HOME="$RUNNER_TEMP/zyron-miner-release-smoke"
          rm -rf "$TEST_HOME"
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            ZYRON_MINER_HOME="$TEST_HOME" "$BUNDLE/node.exe" "$BUNDLE/scripts/miner-launcher.mjs"
          else
            ZYRON_MINER_HOME="$TEST_HOME" "$BUNDLE/node" "$BUNDLE/scripts/miner-launcher.mjs"
          fi
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 78 ]; then echo "expected inactive launcher exit 78, got $STATUS" >&2; exit 1; fi
          if [ -e "$TEST_HOME" ]; then echo 'inactive release candidate touched custody directory' >&2; exit 1; fi

      - name: Write fail-closed release metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const profile = JSON.parse(fs.readFileSync('miner-network-profile.json', 'utf8'));
          if (profile.publicMiningActivated !== false || profile.rpcUrl !== null || profile.genesisFile !== null) {
            throw new Error('candidate metadata requires inactive canonical network profile');
          }
          const metadata = {
            schemaVersion: 1,
            sourceSha: process.env.SOURCE_SHA,
            sourceRef: process.env.SOURCE_REF,
            runnerOs: process.env.RUNNER_OS_VALUE,
            runnerArch: process.env.RUNNER_ARCH_VALUE,
            nodeVersion: process.version,
            publicMiningActivated: false,
            releaseEligible: false,
            platformSigningVerified: false,
            publicationAllowed: false,
            note: 'Candidate evidence only. Promotion requires reviewed platform signing/provenance and explicit public-mining activation.'
          };
          fs.writeFileSync('miner-release/RELEASE-METADATA.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const root = 'miner-release';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name !== 'SHA256SUMS') files.push(full);
            }
          }
          walk(root);
          const lines = files.sort().map((file) => `${crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}  ${file.replaceAll('\\\\','/')}`);
          fs.writeFileSync(path.join(root, 'SHA256SUMS'), `${lines.join('\n')}\n`);
          NODE

      - name: Verify release metadata stays non-publishable
        run: node -e "const m=require('./miner-release/RELEASE-METADATA.json'); if (m.nodeVersion !== 'v22.23.2' || m.publicMiningActivated !== false || m.releaseEligible !== false || m.platformSigningVerified !== false || m.publicationAllowed !== false) throw new Error('release-candidate fail-closed metadata drift')"

      - name: Attest candidate evidence
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            l1/miner-release/SBOM.spdx.json
            l1/miner-release/SHA256SUMS
            l1/miner-release/RELEASE-METADATA.json

      - name: Attest Windows end-user ZIP
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: l1/miner-release/ZyronMiner-windows-*.zip

      - name: Upload non-publishable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zyron-miner-release-candidate-${{ runner.os }}-${{ runner.arch }}
          path: l1/miner-release/
          if-no-files-found: error
          retention-days: 90
