name: Miner Release Candidate CI

on:
  pull_request:
    paths:
      - 'l1/**'
      - '.github/workflows/miner-release-candidate.yml'
      - '.github/scripts/verify-miner-release-candidate-action-custody.mjs'
  workflow_dispatch:
  push:
    tags:
      - 'miner-v*'

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical miner runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: l1/package-lock.json

      - name: Verify runtime pin
        shell: bash
        run: |
          test "$(node -p 'process.version')" = 'v22.23.2'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check miner script syntax
        run: |
          node --check scripts/mine.mjs
          node --check scripts/miner-launcher.mjs
          node --check scripts/miner-launcher-security.mjs
          node --check scripts/test-miner-launcher-security.mjs
          node --check scripts/package-miner.mjs
          node --check scripts/materialize-miner-package-posix.mjs
          node --check scripts/test-miner-package-materializer-posix.mjs
          node --check scripts/miner-packaging-custody-gate.mjs
          node --check scripts/test-miner-packaging-quarantine.mjs
          node --check scripts/test-miner-handle-custody-posix.mjs
          node --check scripts/miner-release-root.mjs
          node --check scripts/test-miner-release-root.mjs
          node --check scripts/test-windows-miner-package-contract.mjs
          node --check scripts/generate-miner-sha256sums.mjs
          node --check scripts/test-miner-release-manifest.mjs
          node --check scripts/test-miner-release-manifest-snapshot.mjs
          node --check scripts/test-miner-release-manifest-root-relative.mjs
          node --check scripts/test-miner-release-manifest-path-controls.mjs

      - name: Run miner launcher custody security regression
        run: node scripts/test-miner-launcher-security.mjs

      - name: Run miner release-root custody regression
        run: node scripts/test-miner-release-root.mjs

      - name: Run Windows miner package quarantine contract
        run: node scripts/test-windows-miner-package-contract.mjs

      - name: Run miner release manifest regressions
        run: |
          node scripts/test-miner-release-manifest.mjs
          node scripts/test-miner-release-manifest-snapshot.mjs
          node scripts/test-miner-release-manifest-root-relative.mjs
          node scripts/test-miner-release-manifest-path-controls.mjs

      - name: Assert inactive release candidate network profile
        run: node -e "const p=require('./miner-network-profile.json'); if (p.publicMiningActivated !== false || p.rpcUrl !== null || p.genesisFile !== null) throw new Error('release candidate profile must remain fail-closed')"

      - name: Exercise descriptor-relative miner custody primitive
        run: node scripts/test-miner-handle-custody-posix.mjs

      - name: Exercise descriptor-relative miner package materializer
        run: node scripts/test-miner-package-materializer-posix.mjs

      - name: Build runtime
        run: npm run build

      - name: Run full L1 regression suite on durability-capable runners
        if: runner.os != 'Windows'
        run: npm test

      - name: Run Windows miner-specific regressions
        if: runner.os == 'Windows'
        run: node --test dist/test/miner-genesis.test.js dist/test/miner-network.test.js dist/test/miner-security.test.js

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prove miner packaging platform gate
        run: node scripts/test-miner-packaging-quarantine.mjs

      - name: Construct audited POSIX release candidate
        if: runner.os != 'Windows'
        run: node scripts/package-miner.mjs

      - name: Verify POSIX candidate remains local and inactive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -d miner-release
          count="$(find miner-release -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$count" = '1'
          test ! -L miner-release
          test -f miner-release/*/miner-network-profile.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(fs.readdirSync('miner-release',{withFileTypes:true}).filter(e=>e.isDirectory()).map(e=>'miner-release/'+e.name+'/miner-network-profile.json')[0],'utf8')); if (p.publicMiningActivated !== false || p.rpcUrl !== null || p.genesisFile !== null) throw new Error('materialized candidate must remain activation-gated')"

      - name: Prove Windows package entrypoint fails closed before writes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if node scripts/package-miner.mjs >package-miner.stdout 2>package-miner.stderr; then
            echo 'Windows package entrypoint unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'miner packaging custody is unsupported on this platform' package-miner.stderr
          if [ -e miner-release ]; then
            echo 'unsupported Windows packaging must fail before miner-release state exists' >&2
            exit 1
          fi
