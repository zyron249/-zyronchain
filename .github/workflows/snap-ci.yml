name: MetaMask Snap CI

on:
  pull_request:
    paths:
      - 'snap/**'
      - 'l1/src/**'
      - 'l1/package.json'
      - 'l1/package-lock.json'
      - 'l1/tsconfig.json'
      - 'l1/scripts/public-testnet-rpc.mjs'
      - '.github/workflows/snap-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'snap/**'
      - 'l1/src/**'
      - 'l1/package.json'
      - 'l1/package-lock.json'
      - 'l1/tsconfig.json'
      - 'l1/scripts/public-testnet-rpc.mjs'
      - '.github/workflows/snap-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            l1/package-lock.json
            snap/package-lock.json
      # The Snap tests compare against the real l1 implementation (l1/dist).
      # Only TypeScript output is needed, so native install scripts are skipped.
      - name: Build l1 (reference implementation for tests)
        working-directory: l1
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install Snap dependencies
        working-directory: snap
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: snap
        run: npm run typecheck
      - name: Build Snap bundle
        working-directory: snap
        run: npm run build
      - name: Manifest shasum is committed and bundle has no Node globals
        run: |
          git diff --exit-code -- snap/snap.manifest.json
          if grep -Eq '(^|[^A-Za-z0-9_.])Buffer([^A-Za-z0-9_]|$)' snap/dist/bundle.js; then
            echo "bundle references Buffer" >&2
            exit 1
          fi
      - name: Test (snaps-jest + l1 oracle)
        working-directory: snap
        run: npx jest --runInBand --ci
      # End to end: the real L1 validator behind the wallet testnet gateway on
      # loopback; the Snap bundle is rebuilt to point at it (after the manifest
      # check above, which uses the default public URL).
      - name: Start wallet testnet RPC (loopback, no value)
        run: |
          npm --prefix l1 rebuild better-sqlite3
          PORT=8788 node l1/scripts/public-testnet-rpc.mjs > "${RUNNER_TEMP}/wallet-testnet-rpc.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/health && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/wallet-testnet-rpc.log"
          exit 1
      - name: Testnet e2e (derive, faucet, balance, send, finalized)
        working-directory: snap
        env:
          ZYRON_TESTNET_RPC_URL: http://127.0.0.1:8788
          ZYRON_E2E_RPC_URL: http://127.0.0.1:8788
        run: npm run build && npx jest --runInBand --ci test/testnet.e2e.test.ts
