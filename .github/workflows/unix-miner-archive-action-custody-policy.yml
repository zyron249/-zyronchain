name: Unix Miner Archive Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/unix-miner-archive-candidate.yml'
      - '.github/scripts/verify-unix-miner-archive-action-custody.mjs'
      - '.github/workflows/unix-miner-archive-action-custody-policy.yml'
      - 'docs/UNIX_MINER_ARCHIVE_ACTION_CUSTODY.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unix-miner-archive-candidate.yml'
      - '.github/scripts/verify-unix-miner-archive-action-custody.mjs'
      - '.github/workflows/unix-miner-archive-action-custody-policy.yml'
      - 'docs/UNIX_MINER_ARCHIVE_ACTION_CUSTODY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Unix miner archive action custody
        run: node .github/scripts/verify-unix-miner-archive-action-custody.mjs
