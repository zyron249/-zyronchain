name: Standalone L1 State-v2 Scale Evidence CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  state-v2-scale-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1 and benchmark
        working-directory: l1
        run: npm run build
      - name: Run 100k-account State-v2 restart and GC benchmark
        env:
          ZYRON_SCALE_ACCOUNTS: "100000"
        run: |
          evidence="${RUNNER_TEMP}/zyron-state-v2-scale"
          mkdir -p "$evidence"
          node l1/dist/bench/state-v2-scale.js > "$evidence/raw.json"
          node l1/scripts/normalize-state-v2-scale-evidence.mjs \
            --result "$evidence/raw.json" \
            --out "$evidence/result.json" \
            --accounts 100000
          node l1/scripts/archive-ci-evidence.mjs \
            --scenario state-v2-scale-100k \
            --result "$evidence/result.json" \
            --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum raw.json result.json evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload State-v2 scale evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-state-v2-scale-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-state-v2-scale/raw.json
            ${{ runner.temp }}/zyron-state-v2-scale/result.json
            ${{ runner.temp }}/zyron-state-v2-scale/evidence.json
            ${{ runner.temp }}/zyron-state-v2-scale/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
