name: Standalone L1 Render Private Testnet Smoke CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  render-private-testnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Rehearse four-validator Render private testnet
        shell: bash
        run: |
          set -o pipefail
          node l1/scripts/render-private-testnet.mjs --smoke | tee "${RUNNER_TEMP}/render-private-testnet-smoke.log"
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l1-render-private-testnet-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-private-testnet-smoke.log
          if-no-files-found: error
          retention-days: 90
