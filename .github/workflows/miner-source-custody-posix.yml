name: Miner Source Custody POSIX CI

on:
  pull_request:
    paths:
      - 'l1/native/miner-source-custody-posix.c'
      - 'l1/scripts/test-miner-source-custody-posix.mjs'
      - '.github/workflows/miner-source-custody-posix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check regression syntax
        run: node --check scripts/test-miner-source-custody-posix.mjs
      - name: Exercise source-root descriptor custody
        run: node scripts/test-miner-source-custody-posix.mjs
