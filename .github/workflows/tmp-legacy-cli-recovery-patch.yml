name: Temporary Legacy CLI Recovery Patcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Apply focused patch
        working-directory: l1
        run: node scripts/tmp-legacy-cli-recovery-patch.mjs
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Typecheck and focused regressions
        working-directory: l1
        run: |
          npm run typecheck
          npm run build
          node --test dist/test/legacy-cli-recovery-custody.test.js dist/test/cli-recovery-file.test.js dist/test/cli-checkpoint-digest.test.js
      - name: Remove temporary workflow and commit final branch state
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/tmp-legacy-cli-recovery-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden direct legacy CLI recovery reads"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${HEAD_BRANCH}
