name: Miner Manifest Publication CI

on:
  pull_request:
    paths:
      - 'l1/scripts/generate-miner-sha256sums.mjs'
      - 'l1/scripts/test-miner-release-manifest-publication.mjs'
      - '.github/workflows/miner-manifest-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up canonical miner runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify manifest publication hardening
        run: |
          node --check scripts/generate-miner-sha256sums.mjs
          node --check scripts/test-miner-release-manifest-publication.mjs
          node scripts/test-miner-release-manifest-publication.mjs
