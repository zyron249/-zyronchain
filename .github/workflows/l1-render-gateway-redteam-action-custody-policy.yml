name: Render Gateway Red-Team Action Custody Policy CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/l1-render-gateway-redteam.yml'
      - '.github/workflows/l1-render-gateway-redteam-action-custody-policy.yml'
      - 'l1/scripts/verify-render-gateway-redteam-action-custody.mjs'
      - 'docs/RENDER_GATEWAY_REDTEAM_ACTION_CUSTODY.md'
  pull_request:
    paths:
      - '.github/workflows/l1-render-gateway-redteam.yml'
      - '.github/workflows/l1-render-gateway-redteam-action-custody-policy.yml'
      - 'l1/scripts/verify-render-gateway-redteam-action-custody.mjs'
      - 'docs/RENDER_GATEWAY_REDTEAM_ACTION_CUSTODY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify gateway red-team action custody policy
        run: node l1/scripts/verify-render-gateway-redteam-action-custody.mjs
