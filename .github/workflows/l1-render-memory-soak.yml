name: Standalone L1 Render Memory Soak CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render-memory-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - working-directory: l1
        run: npm ci && npm run build
      - name: Measure post-warmup process-tree PSS growth through finalized height 12
        run: |
          set -o pipefail
          node l1/scripts/render-memory-soak.mjs | tee "${RUNNER_TEMP}/render-memory-soak.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: l1-render-memory-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-memory-soak.json
          if-no-files-found: error
          retention-days: 90
