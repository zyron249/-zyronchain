name: Standalone L1 Render Memory Soak CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-memory-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build canonical L1
        working-directory: l1
        run: npm run build
      - name: Measure four-validator process memory through finalization
        run: |
          set -o pipefail
          target=6
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then target=10; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then target=12; fi
          ZYRON_MEMORY_SOAK_WARMUP_HEIGHT=2 \
          ZYRON_MEMORY_SOAK_TARGET_HEIGHT="$target" \
          ZYRON_MEMORY_SOAK_MAX_TOTAL_PSS_BYTES=$((440 * 1024 * 1024)) \
          ZYRON_MEMORY_SOAK_MAX_GROWTH_BYTES=$((96 * 1024 * 1024)) \
          node l1/scripts/render-memory-soak.mjs | tee "${RUNNER_TEMP}/render-memory-soak.log"
      - name: Upload memory soak evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-render-memory-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-memory-soak.log
          if-no-files-found: error
          retention-days: 90
