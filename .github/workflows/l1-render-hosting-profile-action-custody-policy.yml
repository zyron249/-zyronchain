name: Standalone L1 Render Hosting Profile Action Custody Policy CI

on:
  pull_request:
    paths:
      - '.github/workflows/l1-render-hosting-profile.yml'
      - '.github/workflows/l1-render-hosting-profile-action-custody-policy.yml'
      - '.github/scripts/verify-l1-render-hosting-profile-action-custody.mjs'
      - 'docs/L1_RENDER_HOSTING_PROFILE_ACTION_CUSTODY.md'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify Render hosting-profile action custody policy
        run: node .github/scripts/verify-l1-render-hosting-profile-action-custody.mjs
