name: Standalone L1 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Protocol v1 devnet: INFORMATIONAL, not a required check (backlog P1-04).
  # Protocol v1 keeps the legacy F-01 split, so this job passes about half the
  # time (A/B: 13/27 before the F-01 fix, 12/27 after; 54/118 job attempts on
  # 2026-10-13..16). The test, its timeouts and the harness are not weakened.
  # The classify step only explains the result: a known F-01 stall becomes a
  # warning, any other failure an error (real regression). The F-01 fix is
  # protocol v6, run by local-devnet-v6. See docs/L1_TEST_RELIABILITY.md.
  local-devnet:
    name: local-devnet (protocol v1, informational, known F-01 flake)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify live two-validator local devnet (protocol v1)
        id: devnet
        shell: bash
        run: npm run devnet:check 2>&1 | tee "$RUNNER_TEMP/local-devnet-v1.log"
      - name: Classify protocol-v1 devnet result (F-01)
        if: always()
        shell: bash
        env:
          DEVNET_OUTCOME: ${{ steps.devnet.outcome }}
        run: node scripts/classify-devnet-v1-result.mjs "$RUNNER_TEMP/local-devnet-v1.log" "$DEVNET_OUTCOME"

  # Same disposable two-validator loopback chain under consensus protocol v6
  # (F-01 fix). Not a required check yet (branch protection is an owner
  # setting). Stability evidence for P1-04: 117 of 118 job attempts passed over
  # 98 workflow runs on 2026-10-13..16; the one failure was a genuine TypeScript
  # build break on a dependency PR. Keep the job id stable: it is the candidate
  # required check.
  local-devnet-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify live two-validator local devnet under protocol v6
        run: npm run devnet:check:v6

  # Four-validator open testnet profile (docs/OPEN_TESTNET.md). Not a
  # required check.
  open-testnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify four-validator open testnet profile (v6, faucet, transfer, restart)
        run: npm run testnet:open:smoke

  l1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify reproducible build and release package
        run: |
          # Two clean builds must produce byte-identical packages; packing one
          # dist/ twice would only prove repeatable packaging.
          first=$(mktemp -d)
          second=$(mktemp -d)
          rm -rf dist
          npm run build
          npm pack --ignore-scripts --pack-destination "$first" >/dev/null
          rm -rf dist
          npm run build
          npm pack --ignore-scripts --pack-destination "$second" >/dev/null
          cmp "$first"/zyronchain-l1-*.tgz "$second"/zyronchain-l1-*.tgz
      - name: Verify runtime SBOM generation
        run: npm sbom --omit=dev --sbom-format=spdx > /dev/null
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  mixed-version-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout fixed pre-v3 binary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 35349589c12a0882d7c2c034cfee520ea9efb3bb
          path: historical-pre-v3
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build current binary
        working-directory: l1
        run: npm ci && npm run build
      - name: Build historical pre-v3 binary
        working-directory: historical-pre-v3/l1
        run: npm ci && npm run build
      - name: Rehearse mixed-version activation and rollback
        env:
          ZYRON_OLD_L1_DIST: ${{ github.workspace }}/historical-pre-v3/l1/dist
        run: |
          evidence="${RUNNER_TEMP}/zyron-evidence"
          mkdir -p "$evidence"
          node l1/scripts/mixed-version-rehearsal.mjs > "$evidence/result.json"
          node l1/scripts/archive-ci-evidence.mjs --scenario mixed-version-upgrade-rollback --result "$evidence/result.json" --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload mixed-version evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-evidence-mixed-version-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-evidence/evidence.json
            ${{ runner.temp }}/zyron-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  disaster-recovery-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build current binary
        working-directory: l1
        run: npm run build
      - name: Rehearse checkpoint restore, catch-up, and restart
        run: |
          evidence="${RUNNER_TEMP}/zyron-evidence"
          mkdir -p "$evidence"
          node l1/scripts/disaster-recovery-rehearsal.mjs > "$evidence/result.json"
          node l1/scripts/archive-ci-evidence.mjs --scenario disaster-recovery --result "$evidence/result.json" --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload disaster-recovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-evidence-disaster-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-evidence/evidence.json
            ${{ runner.temp }}/zyron-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  composite-adversarial-soak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build current binary
        working-directory: l1
        run: npm run build
      - name: Run composite adversarial consensus soak
        run: |
          evidence="${RUNNER_TEMP}/zyron-evidence"
          mkdir -p "$evidence"
          node l1/scripts/composite-adversarial-soak.mjs > "$evidence/result.json"
          node l1/scripts/archive-ci-evidence.mjs --scenario composite-adversarial-soak --result "$evidence/result.json" --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload adversarial soak evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-evidence-adversarial-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-evidence/evidence.json
            ${{ runner.temp }}/zyron-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  multiprocess-native-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: l1/package-lock.json
      - name: Install locked dependencies
        working-directory: l1
        run: npm ci
      - name: Build current binary
        working-directory: l1
        run: npm run build
      - name: Rehearse native P2P catch-up across a hard process crash
        run: |
          evidence="${RUNNER_TEMP}/zyron-evidence"
          mkdir -p "$evidence"
          node l1/scripts/multiprocess-native-recovery.mjs > "$evidence/result.json"
          node l1/scripts/archive-ci-evidence.mjs --scenario multiprocess-native-recovery --result "$evidence/result.json" --out "$evidence/evidence.json"
          cd "$evidence"
          sha256sum evidence.json > SHA256SUMS
          cat evidence.json
      - name: Upload multi-process recovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-evidence-multiprocess-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zyron-evidence/evidence.json
            ${{ runner.temp }}/zyron-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  independent-light-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l1/independent-light-client
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: l1/independent-light-client/requirements.txt
      - name: Install pinned verifier dependency
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run independent negative and vector tests
        run: python -m unittest -v test_verify_vector.py
      - name: Verify the public interoperability vector
        run: python verify_vector.py ../test-vectors/light-client-v1.json
