name: Standalone L1 Release

on:
  push:
    tags:
      - "l1-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: l1/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build release tarball, SBOM and checksums
        run: |
          npm run build
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          npm sbom --omit=dev --sbom-format=spdx > release/SBOM.spdx.json
          cd release
          sha256sum SBOM.spdx.json zyronchain-l1-*.tgz > SHA256SUMS

      - name: Attest release tarball, SBOM and checksum
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            l1/release/zyronchain-l1-*.tgz
            l1/release/SBOM.spdx.json
            l1/release/SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-l1-${{ github.ref_name }}
          path: |
            l1/release/zyronchain-l1-*.tgz
            l1/release/SBOM.spdx.json
            l1/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
