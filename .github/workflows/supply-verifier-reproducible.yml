name: Supply Verifier Reproducible Build

on:
  pull_request:
    paths:
      - 'tools/supply-verifier/**'
      - 'l1/src/**'
      - 'l1/package.json'
      - 'l1/package-lock.json'
      - 'l1/tsconfig*.json'
      - '.github/workflows/supply-verifier-reproducible.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/supply-verifier/**'
      - 'l1/src/**'
      - 'l1/package.json'
      - 'l1/package-lock.json'
      - 'l1/tsconfig*.json'
      - '.github/workflows/supply-verifier-reproducible.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the published Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/supply-verifier/.nvmrc
      - name: Build twice from fresh clones and compare tar hashes
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --version
          for n in 1 2; do
            dir="${RUNNER_TEMP}/clone-${n}"
            git clone --quiet --no-local "${GITHUB_WORKSPACE}" "${dir}"
            git -C "${dir}" checkout --quiet --detach "${SOURCE_SHA}"
            (cd "${dir}" && node tools/supply-verifier/build.mjs --clean-l1 >/dev/null)
            (cd "${dir}" && node tools/supply-verifier/hash.mjs) | tee "${RUNNER_TEMP}/hash-${n}.txt"
          done
          if ! cmp -s "${RUNNER_TEMP}/hash-1.txt" "${RUNNER_TEMP}/hash-2.txt"; then
            echo "::error::supply-verifier tar sha256 differs between two fresh builds"
            exit 1
          fi
          expected="tools/supply-verifier/EXPECTED_SHA256"
          if [ -f "${expected}" ]; then
            want="$(awk 'NF {print $1; exit}' "${expected}")"
            got="$(awk '{print $1}' "${RUNNER_TEMP}/hash-1.txt")"
            if [ "${want}" != "${got}" ]; then
              echo "::error::tar sha256 ${got} does not match ${expected} (${want})"
              exit 1
            fi
            echo "matches ${expected}"
          else
            echo "no ${expected} committed; only build-to-build equality is checked"
          fi
