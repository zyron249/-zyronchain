name: Open Testnet Snapshot Keeper

# Keeps the hosted open TESTNET (tokens have no value) durable and awake without
# depending on any always-on machine. The free web service has no persistent
# disk: on a cold start it restores from the `state.enc` asset of the
# `open-testnet-state` release. This job polls /health every 5 minutes (the free
# instance idles out after 15 minutes without inbound traffic) and every
# 10 minutes (sooner when /health snapshotCache shows a newer build) downloads
# the gateway's sealed /state/snapshot and publishes it.
#
# - The job needs the ZYRON_TESTNET_STATE_SECRET Actions secret (the same value
#   Render generated for the gateway) to authenticate snapshot reads; it is passed
#   only as the keeper step's env. The job runs only on refs/heads/main, so a
#   workflow_dispatch of a modified copy of this file on another branch cannot
#   read the secret. Release uploads use the workflow GITHUB_TOKEN with
#   contents: write.
# - Only the expected genesis is ever published, the published height never goes
#   backwards, and the published asset is renamed aside (never deleted) until
#   its replacement is in place (see .github/scripts/open-testnet-snapshot-keeper.mjs and
#   docs/OPEN_TESTNET.md "Snapshot keepers"). While it runs, stop the legacy
#   machine keeper (deploy/open-testnet/snapshot-keeper.sh); running both loses
#   nothing but lets the legacy delete-then-upload remove state.enc briefly.
# - Scheduled runs are delayed or dropped under load, often by hours, so each run
#   loops for about 5 h 40 min instead of exiting after one cycle. The concurrency
#   group keeps exactly one run active; the next scheduled run waits as pending
#   and starts when the active one ends. GitHub cancels older pending runs of the
#   group, so cancelled scheduled runs in the list are expected. A manual run also
#   waits behind an active run. Because schedules can still leave gaps, the
#   final `chain` job dispatches the next run on main when a run ends (guarded
#   against duplicates and crash loops; see the comment on that job).
# - GitHub disables scheduled workflows after 60 days without repository
#   activity. If that happens the keeper stops: re-enable it with
#   `gh workflow enable open-testnet-snapshot-keeper.yml` (or the Actions tab).
# - Budget: Actions minutes are free for public repositories; the job occupies one
#   hosted runner slot. Keeping the instance awake uses about 720-744 of the 750
#   free instance hours a Render workspace gets per month, so other free web
#   services in the same workspace can exhaust the shared allowance.

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Minutes to keep running (1-340)'
        required: false
        default: '340'

permissions: {}

concurrency:
  group: open-testnet-snapshot-keeper
  cancel-in-progress: false

jobs:
  keep:
    if: github.repository == 'zyron249/-zyronchain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - name: Checkout keeper script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Keep the open testnet awake and publish its sealed snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Owner-approved 2026-10-22 (security review M2): lets the keeper
          # authenticate the sealed snapshot body; headers that disagree with it
          # are refused and nothing is published.
          ZYRON_TESTNET_STATE_SECRET: ${{ secrets.ZYRON_TESTNET_STATE_SECRET }}
          GATEWAY: https://zyron-open-testnet.onrender.com
          TAG: open-testnet-state
          # Deployed genesis observed 2026-10-21 on GET /genesis and GET /status
          # (chain zyron-open-testnet-render-1, genesis timestamp
          # 2026-10-20T22:09:28.767Z). The previous pin 9ad75d77… is the earlier
          # chain still stored as release asset state-9ad75d777141.enc
          # (2026-10-20T20:38:27Z). The Actions keeper refused e0212e57… until
          # this pin matched the chain the host is serving.
          EXPECTED_GENESIS: e0212e574271ef1de78ad148965e3d1a4a04afca3071d3c374d29ae5a6d4a8ad
          RUN_MINUTES: ${{ inputs.run_minutes || '340' }}
          PUBLISH_INTERVAL_SECONDS: '600'
          KEEPALIVE_INTERVAL_SECONDS: '300'
          # The gateway serves /state/snapshot only for a few minutes after each
          # build, so between cycles the keeper reads /health snapshotCache every
          # 45 s and fetches as soon as lastBuiltHeight is newer than the last
          # height fetched; 429/502/503 get jittered retries.
          WATCH_INTERVAL_SECONDS: '45'
          SNAPSHOT_TIMEOUT_SECONDS: '120'
          SNAPSHOT_RETRIES: '4'
        run: node .github/scripts/open-testnet-snapshot-keeper.mjs

  # Self-chain: GitHub delays or drops scheduled runs, which left gaps with no
  # keeper running (2026-11-02 10:28 to 11:26 ET). When a keep run ends, this
  # job dispatches the next run of this workflow on main. GitHub documents that
  # workflow_dispatch events created with GITHUB_TOKEN still create workflow
  # runs (an exception to its no-recursion rule; see docs/OPEN_TESTNET.md
  # "Snapshot keepers"). Only this job gets actions: write, and it never sees
  # the state secret. It first emits an ::error:: annotation (not blocking
  # the chain decision) when the published state.enc is older than
  # MAX_SNAPSHOT_AGE_MINUTES. It chains only when the keep job succeeded (needs
  # result and the jobs API conclusion), the keep job ran at least
  # MIN_RUN_MINUTES (measured from its own started_at; shorter means a crash
  # loop), no other run of this workflow is queued, pending, waiting or in
  # progress, and fewer than MAX_DISPATCHES_PER_DAY workflow_dispatch runs
  # (manual or chained) were created in the last 24 hours. Every skip emits a
  # ::warning::.
  chain:
    needs: keep
    if: always() && github.repository == 'zyron249/-zyronchain' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next keeper run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RESULT: ${{ needs.keep.result }}
          WORKFLOW_FILE: open-testnet-snapshot-keeper.yml
          TAG: open-testnet-state
          MAX_SNAPSHOT_AGE_MINUTES: '30'
          MIN_RUN_MINUTES: '30'
          MAX_DISPATCHES_PER_DAY: '10'
        run: |
          set -euo pipefail
          skip() { echo "::warning title=Keeper not chained::$1"; exit 0; }
          now=$(date -u +%s)
          if asset=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '[.assets[] | select(.name == "state.enc")][0].updated_at // empty' 2>/dev/null) && [ -n "$asset" ]; then
            age=$(( (now - $(date -u -d "$asset" +%s)) / 60 ))
            if [ "$age" -gt "$MAX_SNAPSHOT_AGE_MINUTES" ]; then
              echo "::error title=Stale published snapshot::state.enc was last updated ${age} min ago (> ${MAX_SNAPSHOT_AGE_MINUTES})"
            else
              echo "state.enc age: ${age} min"
            fi
          else
            echo "::error title=Stale published snapshot::could not read state.enc from release $TAG"
          fi
          [ "$KEEP_RESULT" = "success" ] || skip "keep job result is $KEEP_RESULT"
          job=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "keep")][0] | "\(.conclusion) \(.started_at) \(.completed_at)"')
          read -r conclusion started completed <<<"$job"
          [ "$conclusion" = "success" ] || skip "keep job conclusion is $conclusion"
          minutes=$(( ($(date -u -d "$completed" +%s) - $(date -u -d "$started" +%s)) / 60 ))
          [ "$minutes" -ge "$MIN_RUN_MINUTES" ] || skip "keep job ran ${minutes} min (< ${MIN_RUN_MINUTES}); possible crash loop"
          others=0
          for status in queued pending waiting requested in_progress; do
            n=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?status=$status&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length")
            others=$(( others + n ))
          done
          [ "$others" -eq 0 ] || skip "$others other run(s) of this workflow are active or waiting"
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&created=>=$since&per_page=100" --jq '.total_count')
          [ "$recent" -lt "$MAX_DISPATCHES_PER_DAY" ] || skip "$recent workflow_dispatch runs in the last 24 h (>= ${MAX_DISPATCHES_PER_DAY})"
          gh api -X POST "repos/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" -f ref=main
          echo "dispatched the next keeper run on main (keep job ran ${minutes} min)"
