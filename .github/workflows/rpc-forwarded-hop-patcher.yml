name: RPC Forwarded Hop One-Shot Patcher

on:
  push:
    branches:
      - agent/rpc-forwarded-hop-cardinality-v1
    paths:
      - '.github/workflows/rpc-forwarded-hop-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5e6a9c8c33b605cb4c2b0989dd5f3f1b1
        with:
          ref: agent/rpc-forwarded-hop-cardinality-v1
          persist-credentials: false

      - name: Apply bounded trusted-proxy and forwarded-hop hardening
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'l1/src/node-base.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replaceExactly = (before, after, label) => {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing patch anchor: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`ambiguous patch anchor: ${label}`);
            source = source.slice(0, first) + after + source.slice(first + before.length);
          };

          replaceExactly(
            'export const RPC_MAX_REQUESTS_PER_SOCKET = 100;\nconst DEFAULT_CONSENSUS_INFLIGHT_PER_PEER = 4;',
            'export const RPC_MAX_REQUESTS_PER_SOCKET = 100;\nexport const MAX_RPC_TRUSTED_PROXIES = 16;\nexport const MAX_RPC_FORWARDED_HOPS = 16;\nconst DEFAULT_CONSENSUS_INFLIGHT_PER_PEER = 4;',
            'RPC cardinality constants'
          );

          const oldProxySection = `function normalizeProxyAddress(address: string): string {
            const normalized = address.toLowerCase().replace(/^\\[|\\]$/g, "");
            const ipv4Mapped = normalized.startsWith("::ffff:") ? normalized.slice(7) : normalized;
            const candidate = isIP(ipv4Mapped) === 4 ? ipv4Mapped : normalized;
            if (isIP(candidate) === 0) throw new Error("Trusted RPC proxy must be an IP address");
            return candidate;
          }

          export function isTrustedHttpsProxyRequest(
            remoteAddress: string | undefined,
            forwardedProto: string | string[] | undefined,
            trustedProxyAddresses: readonly string[]
          ): boolean {
            if (trustedProxyAddresses.length === 0) return true;
            if (forwardedProto !== "https" || remoteAddress === undefined) return false;
            try {
              const trusted = new Set(trustedProxyAddresses.map(normalizeProxyAddress));
              return trusted.has(normalizeProxyAddress(remoteAddress));
            } catch {
              return false;
            }
          }

          export function rpcRateLimitIdentity(
            remoteAddress: string | undefined,
            forwardedFor: string | string[] | undefined,
            trustedProxyAddresses: readonly string[]
          ): string {
            if (remoteAddress === undefined) return "unknown";
            let remote: string;
            try {
              remote = normalizeProxyAddress(remoteAddress);
            } catch {
              return "unknown";
            }
            if (trustedProxyAddresses.length === 0) return remote;
            const trusted = new Set(trustedProxyAddresses.map(normalizeProxyAddress));
            if (!trusted.has(remote)) return remote;
            if (typeof forwardedFor !== "string" || forwardedFor.length === 0) return \`proxy:\${remote}\`;
            const chain = forwardedFor.split(",").map((item) => item.trim());
            if (chain.length === 0 || chain.some((item) => item.length === 0)) return \`proxy:\${remote}\`;
            for (let index = chain.length - 1; index >= 0; index -= 1) {
              let hop: string;
              try {
                hop = normalizeProxyAddress(chain[index]!);
              } catch {
                return \`proxy:\${remote}\`;
              }
              if (!trusted.has(hop)) return hop;
            }
            return \`proxy:\${remote}\`;
          }`;

          const newProxySection = `function normalizeProxyAddress(address: string): string {
            const normalized = address.toLowerCase().replace(/^\\[|\\]$/g, "");
            const ipv4Mapped = normalized.startsWith("::ffff:") ? normalized.slice(7) : normalized;
            const candidate = isIP(ipv4Mapped) === 4 ? ipv4Mapped : normalized;
            if (isIP(candidate) === 0) throw new Error("Trusted RPC proxy must be an IP address");
            return candidate;
          }

          function normalizeTrustedProxyAddresses(addresses: readonly string[]): ReadonlySet<string> {
            if (addresses.length > MAX_RPC_TRUSTED_PROXIES) {
              throw new Error("Too many configured trusted RPC proxies");
            }
            return new Set(addresses.map(normalizeProxyAddress));
          }

          export function assertRpcTrustedProxyConfiguration(addresses: readonly string[]): void {
            normalizeTrustedProxyAddresses(addresses);
          }

          function isTrustedHttpsProxyRequestFromSet(
            remoteAddress: string | undefined,
            forwardedProto: string | string[] | undefined,
            trusted: ReadonlySet<string>
          ): boolean {
            if (trusted.size === 0) return true;
            if (forwardedProto !== "https" || remoteAddress === undefined) return false;
            try {
              return trusted.has(normalizeProxyAddress(remoteAddress));
            } catch {
              return false;
            }
          }

          export function isTrustedHttpsProxyRequest(
            remoteAddress: string | undefined,
            forwardedProto: string | string[] | undefined,
            trustedProxyAddresses: readonly string[]
          ): boolean {
            try {
              return isTrustedHttpsProxyRequestFromSet(
                remoteAddress,
                forwardedProto,
                normalizeTrustedProxyAddresses(trustedProxyAddresses)
              );
            } catch {
              return false;
            }
          }

          function forwardedHopCountWithinBound(value: string): boolean {
            let hops = 1;
            for (let index = 0; index < value.length; index += 1) {
              if (value.charCodeAt(index) !== 44) continue;
              hops += 1;
              if (hops > MAX_RPC_FORWARDED_HOPS) return false;
            }
            return true;
          }

          function rpcRateLimitIdentityFromSet(
            remoteAddress: string | undefined,
            forwardedFor: string | string[] | undefined,
            trusted: ReadonlySet<string>
          ): string {
            if (remoteAddress === undefined) return "unknown";
            let remote: string;
            try {
              remote = normalizeProxyAddress(remoteAddress);
            } catch {
              return "unknown";
            }
            if (trusted.size === 0) return remote;
            if (!trusted.has(remote)) return remote;
            if (typeof forwardedFor !== "string" || forwardedFor.length === 0) return \`proxy:\${remote}\`;
            if (!forwardedHopCountWithinBound(forwardedFor)) return \`proxy:\${remote}\`;
            const chain = forwardedFor.split(",").map((item) => item.trim());
            if (chain.length === 0 || chain.some((item) => item.length === 0)) return \`proxy:\${remote}\`;
            for (let index = chain.length - 1; index >= 0; index -= 1) {
              let hop: string;
              try {
                hop = normalizeProxyAddress(chain[index]!);
              } catch {
                return \`proxy:\${remote}\`;
              }
              if (!trusted.has(hop)) return hop;
            }
            return \`proxy:\${remote}\`;
          }

          export function rpcRateLimitIdentity(
            remoteAddress: string | undefined,
            forwardedFor: string | string[] | undefined,
            trustedProxyAddresses: readonly string[]
          ): string {
            return rpcRateLimitIdentityFromSet(
              remoteAddress,
              forwardedFor,
              normalizeTrustedProxyAddresses(trustedProxyAddresses)
            );
          }`;

          replaceExactly(oldProxySection, newProxySection, 'trusted proxy identity section');

          replaceExactly(
            '  const trustedProxyAddresses = [...new Set((options.trustedProxyAddresses ?? []).map(normalizeProxyAddress))];',
            '  const trustedProxyAddresses = normalizeTrustedProxyAddresses(options.trustedProxyAddresses ?? []);',
            'RPC server proxy normalization'
          );

          replaceExactly(
            `    if (!isTrustedHttpsProxyRequest(
              request.socket.remoteAddress,
              request.headers["x-forwarded-proto"],
              trustedProxyAddresses
            )) {`,
            `    if (!isTrustedHttpsProxyRequestFromSet(
              request.socket.remoteAddress,
              request.headers["x-forwarded-proto"],
              trustedProxyAddresses
            )) {`,
            'RPC server HTTPS proxy check'
          );

          replaceExactly(
            `    const rate = limiter.consume(rpcRateLimitIdentity(
              request.socket.remoteAddress,
              request.headers["x-forwarded-for"],
              trustedProxyAddresses
            ), Date.now());`,
            `    const rate = limiter.consume(rpcRateLimitIdentityFromSet(
              request.socket.remoteAddress,
              request.headers["x-forwarded-for"],
              trustedProxyAddresses
            ), Date.now());`,
            'RPC server rate-limit identity check'
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Commit branch patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- l1/src/node-base.ts && { echo 'patch produced no change' >&2; exit 1; } || true
          git config user.name 'ZyronChain hardening bot'
          git config user.email 'actions@users.noreply.github.com'
          git add l1/src/node-base.ts
          git commit -m 'Bound RPC trusted proxy and forwarded hop cardinality'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/rpc-forwarded-hop-cardinality-v1 >/dev/null
