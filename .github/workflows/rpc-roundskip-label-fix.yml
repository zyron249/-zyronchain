name: RPC Hardening Branch Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rpc-roundskip-label-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5e6a9c8c33b605cb4c2b0989dd5f3f1b1
        with:
          ref: agent/rpc-forwarded-hop-cardinality-v1
          persist-credentials: false

      - name: Remove unrelated label drift and self-delete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('l1/src/node-base.ts')
          source = path.read_text()
          old = 'const payload = await postJson(`${peer}/round/skip`, { height, round, previousCertificate }, 128_000, this.peerAuthToken, this.peerRequestCredentials);\n      assertPlainRecord(payload, "attestation response");\n      assertExactKeys(payload, ["vote"], "round skip response");'
          new = 'const payload = await postJson(`${peer}/round/skip`, { height, round, previousCertificate }, 128_000, this.peerAuthToken, this.peerRequestCredentials);\n      assertPlainRecord(payload, "round skip response");\n      assertExactKeys(payload, ["vote"], "round skip response");'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one cleanup anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/rpc-roundskip-label-fix.yml
          git diff --check
          git config user.name 'ZyronChain hardening bot'
          git config user.email 'actions@users.noreply.github.com'
          git add l1/src/node-base.ts .github/workflows/rpc-roundskip-label-fix.yml
          git commit -m 'Clean RPC forwarding hardening diff'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/rpc-forwarded-hop-cardinality-v1 >/dev/null
