name: Unix Miner Archive Candidate CI

on:
  pull_request:
    paths:
      - 'l1/**'
      - 'docs/UNIX_MINER_DISTRIBUTION.md'
      - 'docs/MINER_PACKAGING_QUARANTINE.md'
      - '.github/workflows/unix-miner-archive-candidate.yml'
      - '.github/workflows/unix-miner-archive-action-custody-policy.yml'
      - 'scripts/verify-unix-miner-archive-action-custody.mjs'
      - 'docs/UNIX_MINER_ARCHIVE_ACTION_CUSTODY.md'
  workflow_dispatch:
  push:
    tags:
      - 'miner-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  archive-quarantine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: l1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical miner runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: l1/package-lock.json

      - name: Verify runtime pin
        run: test "$(node -p 'process.version')" = 'v22.23.2'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify fail-closed archive quarantine contract
        run: |
          node --check scripts/package-miner.mjs
          node --check scripts/miner-packaging-custody-gate.mjs
          node --check scripts/test-miner-packaging-quarantine.mjs
          node scripts/test-unix-miner-package-contract.mjs
          node scripts/test-miner-launcher-security.mjs
          node -e "const p=require('./miner-network-profile.json'); if (p.publicMiningActivated !== false || p.rpcUrl !== null || p.genesisFile !== null) throw new Error('Unix archive candidate profile must remain fail-closed')"

      - name: Build runtime
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prove Unix miner materialization is quarantined before filesystem writes
        run: node scripts/test-miner-packaging-quarantine.mjs

      - name: Assert no Unix archive candidate was materialized
        run: |
          if [ -e miner-release ]; then
            echo 'custody quarantine must not materialize miner-release' >&2
            exit 1
          fi
          echo 'Unix miner archive candidate remains intentionally non-materialized pending #761.'
