name: Temporary PR 497 integration regression patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr497-test-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/peer-preflight-nonce-reservation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/peer-preflight-nonce-reservation-v1
          persist-credentials: true
      - name: Align integration regression with preflight nonce reservation
        env:
          BRANCH: agent/peer-preflight-nonce-reservation-v1
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('l1/test/l1.test.ts')
          text = path.read_text(encoding='utf-8')
          marker = '    const signed = await fetch(`${base}/block`, {'
          start = text.index(marker, text.index('test("RPC trusted peer identities require signed consensus writes and reject replay"'))
          end_marker = '    assert.equal(replay.status, 401);'
          end = text.index(end_marker, start) + len(end_marker)
          new = '''    const routeHeaders = signPeerRequest(identity, {
              chainId: service.status().chainId,
              genesisHash: service.status().genesisHash,
              method: "POST",
              path: "/block",
              bodySha256: sha256Hex(Buffer.from(canonicalJson({}), "utf8")),
              timestampMs: now,
              nonce: "45".repeat(16)
            });
            const signed = await fetch(`${base}/block`, {
              method: "POST",
              headers: { "content-type": "application/json", ...routeHeaders },
              body: canonicalJson({})
            });
            assert.equal(signed.status, 400);
            assert.notEqual((await signed.json() as { error?: string }).error, "Peer signature authentication required");

            const replay = await fetch(`${base}/block`, {
              method: "POST",
              headers: { "content-type": "application/json", ...routeHeaders },
              body: canonicalJson({})
            });
            assert.equal(replay.status, 401);'''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add l1/test/l1.test.ts
          git commit -m 'Align signed RPC replay regression with nonce reservation'
          git push origin HEAD:"${BRANCH}"
