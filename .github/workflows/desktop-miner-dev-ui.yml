name: Desktop Miner Development UI CI

on:
  pull_request:
    paths:
      - 'desktop-miner/**'
      - '.github/workflows/desktop-miner-dev-ui.yml'

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Check desktop controller syntax
        run: node --check desktop-miner/server.mjs

      - name: Check renderer syntax
        run: node --check desktop-miner/public/app.js

      - name: Check static security contract
        run: node desktop-miner/test-static.mjs
