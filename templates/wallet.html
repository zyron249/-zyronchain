<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zyron Web Wallet</title>
    <script src="/static/vendor/noble-secp256k1-2.3.0.min.js"></script>

    <link rel="stylesheet" href="/static/legacy-wallet/wallet.css">
</head>

<body>
<div class="container">

<h1>🚀 Zyron Web Wallet</h1>
<p class="warning">Keys are generated and recovered in your browser. Never send your mnemonic or private key to a node.</p>

<div class="card">
    <h2>Create Wallet</h2>
    <button data-action="createWallet">Create New Wallet</button>
</div>

<div class="card">
    <h2>Recover Wallet</h2>
    <textarea id="mnemonicInput" rows="3" placeholder="Enter your 12-word BIP39 mnemonic"></textarea>
    <button data-action="recoverWallet">Recover Wallet</button>
</div>

<div class="card">
    <h2>Wallet</h2>
    <button data-action="copyAddress">Copy Address</button>
    <button data-action="togglePrivateKey">Show / Hide Private Key</button>
    <pre id="walletBox">No wallet loaded.</pre>
</div>

<div class="card">
    <h2>Balance & Faucet</h2>
    <button data-action="getBalance">Check Balance</button>
    <button data-action="claimFaucet">Claim Testnet Faucet</button>
</div>

<div class="card">
    <h2>Send ZYN</h2>
    <input id="receiver" placeholder="Receiver Address">
    <input id="amount" placeholder="Amount" type="number" step="0.00000001">
    <input id="fee" placeholder="Fee" type="number" step="0.00000001" value="0.01">
    <button data-action="sendZyn">Send ZYN</button>
</div>

<div class="card">
    <h2>Transaction History</h2>
    <button data-action="loadTransactions">Load Transactions</button>
    <pre id="txBox">No transactions loaded.</pre>
</div>

<div class="card">
    <h2>Result</h2>
    <pre id="resultBox">No result yet.</pre>
</div>

</div>

<script src="/static/legacy-wallet/wallet.js"></script>

</body>
</html>
